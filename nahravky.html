<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pitland – Nahrání záznamu</title>
<link rel="manifest" href="nahravky-manifest.json">
<style>
  :root {
    --pitland-red: #d32f2f;
    --pitland-red-dark: #9a0007;
    --bg: #0f0f10;
    --card: #1b1b1e;
    --text: #f5f5f5;
    --muted: #a0a0a8;
    --border: #2d2d33;
    --ok: #2e7d32;
    --err: #c62828;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px; margin: 0 auto; padding: 24px 20px 80px;
  }
  header {
    text-align: center; margin-bottom: 24px;
  }
  header h1 {
    margin: 0 0 4px; font-size: 26px; color: var(--pitland-red);
    letter-spacing: 0.5px;
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  label {
    display: block; font-size: 13px; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  input[type="text"], select {
    width: 100%; padding: 14px 16px;
    background: #111114; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 17px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  input[type="text"]:focus, select:focus { border-color: var(--pitland-red); }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23a0a0a8' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat; background-position: right 16px center;
    padding-right: 40px;
  }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }

  .file-area {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 28px 20px; text-align: center;
    background: #111114; transition: all 0.2s;
  }
  .file-area.has-file { border-color: var(--pitland-red); background: #1a0e0e; }
  .file-area .icon { font-size: 42px; margin-bottom: 8px; }
  .file-area .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .file-name { font-size: 15px; word-break: break-all; }
  input[type="file"] { display: none; }
  .file-btn {
    display: inline-block; padding: 10px 18px; margin-top: 10px;
    background: #2a2a30; color: var(--text);
    border-radius: 8px; font-size: 14px; cursor: pointer;
  }

  button.submit {
    width: 100%; padding: 16px;
    background: var(--pitland-red); color: white;
    border: none; border-radius: 12px;
    font-size: 18px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
    transition: background 0.2s;
  }
  button.submit:disabled { background: #555; cursor: not-allowed; }
  button.submit:active:not(:disabled) { background: var(--pitland-red-dark); }

  .status {
    margin-top: 16px; padding: 14px 16px;
    border-radius: 10px; font-size: 14px; display: none;
  }
  .status.show { display: block; }
  .status.info { background: #1a2a3a; color: #8fc5f5; border: 1px solid #2c4864; }
  .status.ok { background: #14331b; color: #7dd890; border: 1px solid #2e7d32; }
  .status.err { background: #3a1414; color: #f5a0a0; border: 1px solid #c62828; }

  .progress {
    height: 8px; background: #2a2a30; border-radius: 4px;
    overflow: hidden; margin-top: 10px; display: none;
  }
  .progress.show { display: block; }
  .progress-bar {
    height: 100%; background: var(--pitland-red);
    width: 0%; transition: width 0.2s;
  }

  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PITLAND</h1>
    <p>Nahrání záznamu porady nebo tréninku</p>
  </header>

  <form id="uploadForm" class="card">
    <div class="field">
      <label for="jmeno">Kdo nahrává? (Jméno)</label>
      <input type="text" id="jmeno" name="jmeno" placeholder="např. Jiří" required autocomplete="given-name">
    </div>

    <div class="field">
      <label for="druh">Druh nahrávky</label>
      <select id="druh" name="druh" required>
        <option value="">— vyber —</option>
        <option value="briefing">Briefing</option>
        <option value="debriefing">Debriefing</option>
        <option value="meeting-1-1">Meeting 1:1</option>
        <option value="zpetna-vazba">Zpětná vazba</option>
        <option value="porada">Porada</option>
        <option value="jine">Jiné</option>
      </select>
    </div>

    <div class="field" id="skymField" style="display:none;">
      <label for="skym">S kým</label>
      <input type="text" id="skym" name="skym" placeholder="např. Petr Novák" autocomplete="off">
    </div>

    <div class="field">
      <label>Zvukový soubor</label>
      <label for="fileInput" class="file-area" id="fileArea">
        <div class="icon">🎙️</div>
        <div class="file-name" id="fileName">Klepni pro výběr nahrávky</div>
        <div class="hint">.m4a, .mp3, .wav, .aac</div>
        <span class="file-btn">Vybrat soubor</span>
      </label>
      <input type="file" id="fileInput" name="file" accept="audio/*" required>
    </div>

    <button type="submit" class="submit" id="submitBtn">Nahrát na Drive</button>

    <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status" id="status"></div>
  </form>

  <footer>Pitland · v1.2</footer>
</div>

<script>
  // === SERVICE WORKER (Web Share Target) ===
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(err => console.warn('[SW] Registrace selhala:', err));
  }

  // Pokud jsme otevřeni přes sdílení z Diktafonu (?shared=1),
  // načteme soubor z IndexedDB a předvyplníme formulář
  function nactiSdilenySoubor() {
    return new Promise((resolve) => {
      const dbReq = indexedDB.open('pitland-share', 1);
      dbReq.onupgradeneeded = (e) => {
        if (!e.target.result.objectStoreNames.contains('soubory'))
          e.target.result.createObjectStore('soubory');
      };
      dbReq.onsuccess = (e) => {
        const db = e.target.result;
        try {
          const tx = db.transaction('soubory', 'readwrite');
          const req = tx.objectStore('soubory').get('cekajici');
          req.onsuccess = () => {
            const file = req.result;
            if (file) {
              // Smažeme záznam hned, aby se neobjevil při dalším otevření
              tx.objectStore('soubory').delete('cekajici');
              resolve(file);
            } else {
              resolve(null);
            }
          };
          req.onerror = () => resolve(null);
          tx.oncomplete = () => db.close();
        } catch (_) { resolve(null); }
      };
      dbReq.onerror = () => resolve(null);
    });
  }

  // === KONFIGURACE ===
  // Sem vlož URL nasazeného Google Apps Script webhooku (viz NAVOD-NAHRAVKY.md)
  const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz4pNkjjM0FBKUlCwVR97aiBWczlpL3fjw19Q7z8rDkP2xZVGVWASLmMxvx-6YXAuZb/exec";
  // Max. velikost (Apps Script má limit cca 50 MB na doPost payload)
  const MAX_SIZE_MB = 45;
  // ===================

  const form = document.getElementById("uploadForm");
  const fileInput = document.getElementById("fileInput");
  const fileArea = document.getElementById("fileArea");
  const fileName = document.getElementById("fileName");
  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const progress = document.getElementById("progress");
  const progressBar = document.getElementById("progressBar");
  const druhSelect = document.getElementById("druh");
  const skymField = document.getElementById("skymField");
  const skymInput = document.getElementById("skym");

  // Druhy, u kterých se ptáme "s kým"
  const DRUHY_S_KYM = ["meeting-1-1", "zpetna-vazba"];

  druhSelect.addEventListener("change", () => {
    if (DRUHY_S_KYM.includes(druhSelect.value)) {
      skymField.style.display = "block";
      skymInput.setAttribute("required", "required");
    } else {
      skymField.style.display = "none";
      skymInput.removeAttribute("required");
      skymInput.value = "";
    }
  });

  // Automatická obnova jména z local storage (ať to SAM nepíše pořád dokola)
  try {
    const savedName = localStorage.getItem("pitland_jmeno");
    if (savedName) document.getElementById("jmeno").value = savedName;
  } catch (e) {}

  // Pokud jsme přišli přes Web Share Target (sdílení z Diktafonu),
  // automaticky předvyplníme soubor z IndexedDB
  if (location.search.includes('shared=1')) {
    nactiSdilenySoubor().then(file => {
      if (!file) return;
      // Vložíme soubor do file inputu přes DataTransfer
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      // Zobrazíme název a velikost
      const sizeMb = (file.size / 1024 / 1024).toFixed(1);
      fileName.textContent = file.name + " (" + sizeMb + " MB)";
      fileArea.classList.add("has-file");
      showStatus("info", "✔ Nahrávka z Diktafonu načtena. Vyplň zbývající pole a odešli.");
    });
  }

  // Pokud jsme otevřeni přes iOS Zkratku (?load=ID),
  // stáhneme soubor z Apps Script temp storage a předvyplníme formulář
  const loadId = new URLSearchParams(location.search).get('load');
  if (loadId) {
    showStatus('info', '⏳ Načítám nahrávku ze Zkratky…');
    fetch(WEBHOOK_URL + '?id=' + encodeURIComponent(loadId))
      .then(r => r.json())
      .then(result => {
        if (!result.ok || !result.data) {
          showStatus('err', '❌ Nepodařilo se načíst nahrávku: ' + (result.error || 'neznámá chyba'));
          return;
        }
        const bytes = Uint8Array.from(atob(result.data), c => c.charCodeAt(0));
        const file = new File([bytes], result.filename || 'nahravka.m4a', { type: result.mimeType || 'audio/m4a' });
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        const sizeMb = (file.size / 1024 / 1024).toFixed(1);
        fileName.textContent = file.name + ' (' + sizeMb + ' MB)';
        fileArea.classList.add('has-file');
        showStatus('info', '✔ Nahrávka načtena. Vyplň jméno a druh a odešli.');
        // Odstraníme ?load=ID z URL bez obnovení stránky
        history.replaceState(null, '', location.pathname);
      })
      .catch(() => showStatus('err', '❌ Nepodařilo se načíst nahrávku ze Zkratky. Zkus znovu.'));
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files && fileInput.files[0]) {
      const f = fileInput.files[0];
      const sizeMb = (f.size / 1024 / 1024).toFixed(1);
      fileName.textContent = f.name + " (" + sizeMb + " MB)";
      fileArea.classList.add("has-file");
      if (f.size > MAX_SIZE_MB * 1024 * 1024) {
        showStatus("err", "Soubor je moc velký (" + sizeMb + " MB). Limit je " + MAX_SIZE_MB + " MB. Zkus nahrávku zkrátit nebo zkomprimovat.");
      } else {
        hideStatus();
      }
    }
  });

  function showStatus(type, msg) {
    statusEl.className = "status show " + type;
    statusEl.textContent = msg;
  }
  function hideStatus() {
    statusEl.className = "status";
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // odřízneme "data:...;base64," prefix
        const result = reader.result.toString();
        const comma = result.indexOf(",");
        resolve(result.slice(comma + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideStatus();

    if (WEBHOOK_URL.startsWith("ZDE_VLOZ")) {
      showStatus("err", "Webhook URL není nastavená. Otevři nahravky.html a vlož URL z Apps Script (viz návod).");
      return;
    }

    const file = fileInput.files[0];
    if (!file) {
      showStatus("err", "Nejdřív vyber zvukový soubor.");
      return;
    }
    if (file.size > MAX_SIZE_MB * 1024 * 1024) {
      showStatus("err", "Soubor je moc velký. Limit " + MAX_SIZE_MB + " MB.");
      return;
    }

    const jmeno = document.getElementById("jmeno").value.trim();
    const druh = druhSelect.value;
    const skym = skymInput.value.trim();
    if (!jmeno || !druh) {
      showStatus("err", "Vyplň jméno a druh nahrávky.");
      return;
    }
    if (DRUHY_S_KYM.includes(druh) && !skym) {
      showStatus("err", "U tohoto druhu nahrávky vyplň, s kým to bylo.");
      return;
    }

    try { localStorage.setItem("pitland_jmeno", jmeno); } catch (e) {}

    submitBtn.disabled = true;
    submitBtn.textContent = "Nahrávám…";
    progress.classList.add("show");
    progressBar.style.width = "15%";
    showStatus("info", "Připravuji soubor…");

    try {
      const base64 = await fileToBase64(file);
      progressBar.style.width = "45%";
      showStatus("info", "Odesílám na Drive… (může chvíli trvat)");

      const payload = {
        jmeno: jmeno,
        druh: druh,
        skym: skym,
        filename: file.name,
        mimeType: file.type || "audio/m4a",
        data: base64
      };

      // Apps Script doPost – používáme text/plain, aby se předešlo CORS preflight
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      progressBar.style.width = "90%";

      const text = await res.text();
      let result;
      try { result = JSON.parse(text); } catch (e) { result = { ok: false, error: text }; }

      if (res.ok && result.ok) {
        progressBar.style.width = "100%";
        showStatus("ok", "✅ Hotovo! Soubor uložen jako: " + (result.filename || file.name));
        submitBtn.textContent = "Nahrát další";
        fileInput.value = "";
        fileName.textContent = "Klepni pro výběr nahrávky";
        fileArea.classList.remove("has-file");
      } else {
        throw new Error(result.error || ("HTTP " + res.status));
      }
    } catch (err) {
      showStatus("err", "❌ Chyba: " + err.message);
      progress.classList.remove("show");
      progressBar.style.width = "0%";
    } finally {
      submitBtn.disabled = false;
      if (submitBtn.textContent === "Nahrávám…") submitBtn.textContent = "Nahrát na Drive";
    }
  });
</script>
</body>
</html>
