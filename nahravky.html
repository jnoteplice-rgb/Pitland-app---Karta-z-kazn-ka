<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pitland â NahrÃ¡nÃ­ zÃ¡znamu</title>
<link rel="manifest" href="nahravky-manifest.json">
<style>
  :root {
    --pitland-green: #c6ff00;
    --pitland-green-dark: #a3d400;
    --pitland-green-glow: rgba(198, 255, 0, 0.25);
    --bg: #000000;
    --card: #151517;
    --card-input: #0a0a0b;
    --text: #f5f5f5;
    --muted: #9a9aa2;
    --border: #2a2a2f;
    --ok: #6fbe2a;
    --err: #c62828;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px; margin: 0 auto; padding: 28px 20px 80px;
  }
  header {
    text-align: center; margin-bottom: 28px;
  }
  header .logo {
    display: block;
    width: 220px; max-width: 70%;
    height: auto;
    margin: 0 auto 10px;
    filter: drop-shadow(0 0 18px var(--pitland-green-glow));
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; margin-bottom: 16px;
  }
  label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
    font-weight: 600;
    transition: color 0.15s;
  }
  label.empty-required {
    color: #ff4d4d;
  }
  input[type="text"], select {
    width: 100%; padding: 14px 16px;
    background: var(--card-input); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 17px; outline: none;
    -webkit-appearance: none; appearance: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, select:focus {
    border-color: var(--pitland-green);
    box-shadow: 0 0 0 3px var(--pitland-green-glow);
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23c6ff00' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat; background-position: right 16px center;
    padding-right: 40px;
  }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  .file-area {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 28px 20px; text-align: center;
    background: var(--card-input); transition: all 0.2s;
    cursor: pointer;
  }
  .file-area.has-file {
    border-color: var(--pitland-green);
    border-style: solid;
    background: #0e1400;
    box-shadow: 0 0 0 3px var(--pitland-green-glow);
  }
  .file-area .icon { font-size: 42px; margin-bottom: 8px; }
  .file-area .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .file-name { font-size: 15px; word-break: break-all; }
  input[type="file"] { display: none; }
  .file-btn {
    display: inline-block; padding: 10px 18px; margin-top: 12px;
    background: #222226; color: var(--text);
    border-radius: 8px; font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  .file-area.has-file .file-btn {
    background: var(--pitland-green); color: #000; font-weight: 600;
  }

  button.submit {
    width: 100%; padding: 17px;
    background: var(--pitland-green); color: #000;
    border: none; border-radius: 12px;
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer; margin-top: 10px;
    transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
    box-shadow: 0 0 0 0 var(--pitland-green-glow);
  }
  button.submit:not(:disabled) {
    box-shadow: 0 4px 24px var(--pitland-green-glow);
  }
  button.submit:disabled {
    background: #3a3a3f; color: #888; cursor: not-allowed;
    box-shadow: none;
  }
  button.submit:active:not(:disabled) {
    background: var(--pitland-green-dark);
    transform: scale(0.99);
  }

  .status {
    margin-top: 16px; padding: 14px 16px;
    border-radius: 10px; font-size: 14px; display: none;
    line-height: 1.4;
  }
  .status.show { display: block; }
  .status.info {
    background: #12160a; color: var(--pitland-green);
    border: 1px solid #3a4a0a;
  }
  .status.ok {
    background: #152200; color: var(--pitland-green);
    border: 1px solid var(--pitland-green-dark);
  }
  .status.err {
    background: #2a0e0e; color: #f5a0a0;
    border: 1px solid #c62828;
  }

  .progress {
    height: 8px; background: #1e1e22; border-radius: 4px;
    overflow: hidden; margin-top: 12px; display: none;
  }
  .progress.show { display: block; }
  .progress-bar {
    height: 100%; background: var(--pitland-green);
    width: 0%; transition: width 0.2s;
    box-shadow: 0 0 12px var(--pitland-green-glow);
  }

  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="pitland_logo.png" alt="Pitland" class="logo">
    <p>NahrÃ¡nÃ­ zÃ¡znamu porady nebo trÃ©nÃ­nku</p>
  </header>

  <form id="uploadForm" class="card">
    <div class="field">
      <label for="jmeno" id="jmenoLabel">Kdo nahrÃ¡vÃ¡? (JmÃ©no)</label>
      <input type="text" id="jmeno" name="jmeno" placeholder="napÅ. JiÅÃ­" required autocomplete="given-name">
    </div>

    <div class="field">
      <label for="druh" id="druhLabel">Druh nahrÃ¡vky</label>
      <select id="druh" name="druh" required>
        <option value="">â vyber â</option>
        <option value="briefing">Briefing</option>
        <option value="debriefing">Debriefing</option>
        <option value="meeting-1-1">Meeting 1:1</option>
        <option value="zpetna-vazba">ZpÄtnÃ¡ vazba</option>
        <option value="porada">Porada</option>
        <option value="jine">JinÃ©</option>
      </select>
    </div>

    <div class="field" id="skymField" style="display:none;">
      <label for="skym" id="skymLabel">S kÃ½m</label>
      <input type="text" id="skym" name="skym" placeholder="napÅ. Petr NovÃ¡k" autocomplete="off">
    </div>

    <div class="field">
      <label id="fileLabel">ZvukovÃ½ soubor</label>
      <label for="fileInput" class="file-area" id="fileArea">
        <div class="icon">ðï¸</div>
        <div class="file-name" id="fileName">Klepni pro vÃ½bÄr nahrÃ¡vky</div>
        <div class="hint">.m4a, .mp3, .wav, .aac</div>
        <span class="file-btn">Vybrat soubor</span>
      </label>
      <input type="file" id="fileInput" name="file" accept="audio/*" required>
    </div>

    <button type="submit" class="submit" id="submitBtn">NahrÃ¡t na Drive</button>

    <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status" id="status"></div>
  </form>

  <footer>Pitland Â· v1.5</footer>
</div>

<script>
  // === SERVICE WORKER (Web Share Target) ===
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(err => console.warn('[SW] Registrace selhala:', err));
  }

  // Pokud jsme otevÅeni pÅes sdÃ­lenÃ­ z Diktafonu (?shared=1),
  // naÄteme soubor z IndexedDB a pÅedvyplnÃ­me formulÃ¡Å
  function nactiSdilenySoubor() {
    return new Promise((resolve) => {
      const dbReq = indexedDB.open('pitland-share', 1);
      dbReq.onupgradeneeded = (e) => {
        if (!e.target.result.objectStoreNames.contains('soubory'))
          e.target.result.createObjectStore('soubory');
      };
      dbReq.onsuccess = (e) => {
        const db = e.target.result;
        try {
          const tx = db.transaction('soubory', 'readwrite');
          const req = tx.objectStore('soubory').get('cekajici');
          req.onsuccess = () => {
            const file = req.result;
            if (file) {
              // SmaÅ¾eme zÃ¡znam hned, aby se neobjevil pÅi dalÅ¡Ã­m otevÅenÃ­
              tx.objectStore('soubory').delete('cekajici');
              resolve(file);
            } else {
              resolve(null);
            }
          };
          req.onerror = () => resolve(null);
          tx.oncomplete = () => db.close();
        } catch (_) { resolve(null); }
      };
      dbReq.onerror = () => resolve(null);
    });
  }

  // === KONFIGURACE ===
  // Sem vloÅ¾ URL nasazenÃ©ho Google Apps Script webhooku (viz NAVOD-NAHRAUDÙ,Íd)
  const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwjRZEsl9l7Lqjk0US27Wisu4AfJzOoLixxYdaeuibn1UwErUzdOpgnreMMWjsp1s6k/exec";
  // Max. velikost (Apps Script mÃ¡ limit cca 50 MB na doPost payload)
  const MAX_SIZE_MB = 45;
  // ==================

  const form = document.getElementById("uploadForm");
  const fileInput = document.getElementById("fileInput");
  const fileArea = document.getElementById("fileArea");
  const fileName = document.getElementById("fileName");
  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const progress = document.getElementById("progress");
  const progressBar = document.getElementById("progressBar");
  const druhSelect = document.getElementById("druh");
  const skymField = document.getElementById("skymField");
  const skymInput = document.getElementById("skym");
  const jmenoInput = document.getElementById("jmeno");
  const jmenoLabel = document.getElementById("jmenoLabel");
  const druhLabel = document.getElementById("druhLabel");
  const skymLabel = document.getElementById("skymLabel");
  const fileLabel = document.getElementById("fileLabel");

  // Druhy, u kterÃ½ch se ptÃ¡me na dalÅ¡Ã­ osoby
  const DRUHY_S_KYM = ["meeting-1-1", "zpetna-vazba", "porada"];

  // Popisky pro pole "s kÃ½m" podle druhu
  const SKYM_LABELS = {
    "meeting-1-1": { label: "S kÃ½m", placeholder: "napÅ. Petr NovÃ¡k" },
    "zpetna-vazba": { label: "S kÃ½m", placeholder: "napÅ. Petr NovÃ¡k" },
    "porada": { label: "ÃÄastnÃ­ci porady", placeholder: "napÅ. Petr, Jana, TomÃ¡Å¡" }
  };

  function updateSkymField() {
    const v = druhSelect.value;
    if (DRUHY_S_KYM.includes(v)) {
      const cfg = SKYM_LABELS[v] || { label: "S kÃ½m", placeholder: "" };
      skymLabel.textContent = cfg.label;
      skymInput.placeholder = cfg.placeholder;
      skymField.style.display = "block";
      skymInput.setAttribute("required", "required");
    } else {
      skymField.style.display = "none";
      skymInput.removeAttribute("required");
      skymInput.value = "";
    }
    updateRequiredLabels();
  }

  druhSelect.addEventListener("change", updateSkymField);

  // === ÄervenÃ© popisky pro prÃ¡zdnÃ¡ povinnÃ¡ pole ===
  function updateRequiredLabels() {
    jmenoLabel.classList.toggle("empty-required", !jmenoInput.value.trim());
    druhLabel.classList.toggle("empty-required", !druhSelect.value);
    if (skymField.style.display !== "none") {
      skymLabel.classList.toggle("empty-required", !skymInput.value.trim());
    } else {
      skymLabel.classList.remove("empty-required");
    }
    const hasFile = fileInput.files && fileInput.files.length > 0;
    fileLabel.classList.toggle("empty-required", !hasFile);
  }

  jmenoInput.addEventListener("input", updateRequiredLabels);
  skymInput.addEventListener("input", updateRequiredLabels);

  // AutomatickÃ¡ obnova jmÃ©na z local storage (aÅ¥ to SAM nepÃ­Å¡e poÅÃ¡d dokola)
  try {
    const savedName = localStorage.getItem("pitland_jmeno");
    if (savedName) jmenoInput.value = savedName;
  } catch (e) {}

  // Nastav poÄÃ¡teÄnÃ­ stav ÄervenÃ½ch popiskÅ¯
  updateRequiredLabels();

  // Pokud jsme pÅiÅ¡li pÅes Web Share Target (sdÃ­lenÃ­ z Diktafonu),
  // automaticky pÅedvyplnÃ­me soubor z IndexedDB
  if (location.search.includes('shared=1')) {
    nactiSdilenySoubor().then(file => {
      if (!file) return;
      // VloÅ¾Ã­me soubor do file inputu pÅes DataTransfer
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      // ZobrazÃ­me nÃ¡zev a velikost
      const sizeMb = (file.size / 1024 / 1024).toFixed(1);
      fileName.textContent = file.name + " (" + sizeMb + " MB)";
      fileArea.classList.add("has-file");
      updateRequiredLabels();
      showStatus("info", "â NahrÃ¡vka z Diktafonu naÄtena. VyplÅ zbÃ½vajÃ­cÃ­ pole a odeÅ¡li.");
    });
  }

  // Pokud jsme otevÅeni pÅes iOS Zkratku (?load=ID),
  // stÃ¡hneme soubor z Apps Script temp storage a pÅedvyplnÃ­me formulÃ¡Å.
  // ProtoÅ¾e iOS otevÅe strÃ¡nku dÅÃ­v, neÅ¾ GAS dokonÄÃ­ uloÅ¾enÃ­, opakujeme
  // dotaz kaÅ¾dÃ© 2 s, max. 20Ã (= 40 s celkem).
  const loadId = new URLSearchParams(location.search).get('load');
  if (loadId) {
    (async function pollTempFile() {
      const MAX_ATTEMPTS = 20;
      const DELAY_MS = 2000;
      showStatus('info', 'â³ NaÄÃ­tÃ¡m nahrÃ¡vku ze Zkratkyâ¦ (1/' + MAX_ATTEMPTS + ')');
      for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        try {
          const r = await fetch(WEBHOOK_URL + '?id=' + encodeURIComponent(loadId));
          const result = await r.json();
          if (result.ok && result.data) {
            // ÃspÄch â soubor je pÅipraven
            const bytes = Uint8Array.from(atob(result.data), c => c.charCodeAt(0));
            const file = new File([bytes], result.filename || 'nahravka.m4a', { type: result.mimeType || 'audio/m4a' });
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
            const sizeMb = (file.size / 1024 / 1024).toFixed(1);
            fileName.textContent = file.name + ' (' + sizeMb + ' MB)';
            fileArea.classList.add('has-file');
            updateRequiredLabels();
            showStatus('info', 'â NahrÃ¡vka naÄtena. VyplÅ jmÃ©no a druh a odeÅ¡li.');
            // OdstranÃ­me ?load=ID z URL bez obnovenÃ­ strÃ¡nky
            history.replaceState(null, '', location.pathname);
            return;
          }
          // Soubor jeÅ¡tÄ nenÃ­ pÅipraven â ÄekÃ¡me a zkusÃ­me znovu
          if (attempt < MAX_ATTEMPTS) {
            showStatus('info', 'â³ NaÄÃ­tÃ¡m nahrÃ¡vku ze Zkratkyâ¦ (' + (attempt + 1) + '/' + MAX_ATTEMPTS + ')');
            await new Promise(res => setTimeout(res, DELAY_MS));
          }
        } catch (err) {
          if (attempt < MAX_ATTEMPTS) {
            await new Promise(res => setTimeout(res, DELAY_MS));
          }
        }
      }
      showStatus('err', 'â NepodaÅilo se naÄÃ­st nahrÃ¡vku ze Zkratky (vyprÅ¡el ÄasovÃ½ limit). Zkus sdÃ­let nahrÃ¡vku znovu.');
    })();
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files && fileInput.files[0]) {
      const f = fileInput.files[0];
      const sizeMb = (f.size / 1024 / 1024).toFixed(1);
      fileName.textContent = f.name + " (" + sizeMb + " MB)";
      fileArea.classList.add("has-file");
      if (f.size > MAX_SIZE_MB * 1024 * 1024) {
        showStatus("err", "Soubor je moc velkÃ½ (" + sizeMb + " MB). Limit je " + MAX_SIZE_MB + " MB. Zkus nahrÃ¡vku zkrÃ¡tit nebo zkomprimovat.");
      } else {
        hideStatus();
      }
    }
    updateRequiredLabels();
  });

  function showStatus(type, msg) {
    statusEl.className = "status show " + type;
    statusEl.textContent = msg;
  }
  function hideStatus() {
    statusEl.className = "status";
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // odÅÃ­zneme "data:...;base64," prefix
        const result = reader.result.toString();
        const comma = result.indexOf(",");
        resolve(result.slice(comma + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideStatus();

    if (WEBHOOK_URL.startsWith("ZDE_VLOZ")) {
      showStatus("err", "Webhook URL nenÃ­ nastavenÃ¡. OtevÅi nahravky.html a vloÅ¾ URL z Apps Script (viz nÃ¡vod).");
      return;
    }

    const file = fileInput.files[0];
    if (!file) {
      showStatus("err", "NejdÅÃ­v vyber zvukovÃ½ soubor.");
      return;
    }
    if (file.size > MAX_SIZE_MB * 1024 * 1024) {
      showStatus("err", "Soubor je moc velkÃ½. Limit " + MAX_SIZE_MB + " MB.");
      return;
    }

    const jmeno = document.getElementById("jmeno").value.trim();
    const druh = druhSelect.value;
    const skym = skymInput.value.trim();
    if (!jmeno || !druh) {
      showStatus("err", "VyplÅ jmÃ©no a druh nahrÃ¡vky.");
      return;
    }
    if (DRUHY_S_KYM.includes(druh) && !skym) {
      showStatus("err", "U tohoto druhu nahrÃ¡vky vyplÅ, s kÃ½m to bylo.");
      return;
    }

    try { localStorage.setItem("pitland_jmeno", jmeno); } catch (e) {}

    submitBtn.disabled = true;
    submitBtn.textContent = "NahrÃ¡vÃ¡mâ¦";
    progress.classList.add("show");
    progressBar.style.width = "15%";
    showStatus("info", "PÅipravuji souborâ¦");

    try {
      const base64 = await fileToBase64(file);
      progressBar.style.width = "45%";
      showStatus("info", "OdesÃ­lÃ¡m na Driveâ¦ (mÅ¯Å¾e chvÃ­li trvat)");

      const payload = {
        jmeno: jmeno,
        druh: druh,
        skym: skym,
        filename: file.name,
        mimeType: file.type || "audio/m4a",
        data: base64
      };

      // Apps Script doPost â pouÅ¾Ã­vÃ¡me text/plain, aby se pÅedeÅ¡lo CORS preflight
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      progressBar.style.width = "90%";

      const text = await res.text();
      let result;
      try { result = JSON.parse(text); } catch (e) { result = { ok: false, error: text }; }

      if (res.ok && result.ok) {
        progressBar.style.width = "100%";
        showStatus("ok", "â Hotovo! Soubor uloÅ¾en jako: " + (result.filename || file.name));
        submitBtn.textContent = "NahrÃ¡t dalÅ¡Ã­";
        fileInput.value = "";
        fileName.textContent = "Klepni pro vÃ½bÄr nahrÃ¡vky";
        fileArea.classList.remove("has-file");
        updateRequiredLabels();
      } else {
        throw new Error(result.error || ("HTTP " + res.status));
      }
    } catch (err) {
      showStatus("err", "â Chyba: " + err.message);
      progress.classList.remove("show");
      progressBar.style.width = "0%";
    } finally {
      submitBtn.disabled = false;
      if (submitBtn.textContent === "NahrÃ¡vÃ¡mâ¦") submitBtn.textContent = "NahrÃ¡t na Drive";
    }
  });
</script>
</body>
</html>
