<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pitland – Nahrání záznamu</title>
<link rel="manifest" href="nahravky-manifest.json">
<!-- v1.30: KILL coi-serviceworker (zpusobovala strobing loop na iOS) + pure Web Audio path -->
<script>
// Unregister any existing service workers (mainly coi-serviceworker leftover from v1.28/v1.29)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(registrations) {
    var killed = 0;
    for (var i = 0; i < registrations.length; i++) {
      registrations[i].unregister();
      killed++;
    }
    if (killed > 0) console.log('v1.30: killed ' + killed + ' service workers');
  });
  // Also clear caches that might have been populated by SW
  if (window.caches) {
    caches.keys().then(function(names) {
      for (var i = 0; i < names.length; i++) caches.delete(names[i]);
    });
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
  :root {
    --pitland-green: #c6ff00;
    --pitland-green-dark: #a3d400;
    --pitland-green-glow: rgba(198, 255, 0, 0.25);
    --bg: #000000;
    --card: #151517;
    --card-input: #0a0a0b;
    --text: #f5f5f5;
    --muted: #9a9aa2;
    --border: #2a2a2f;
    --ok: #6fbe2a;
    --err: #c62828;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 80px; }
  header { text-align: center; margin-bottom: 28px; }
  header .logo {
    display: block; width: 220px; max-width: 70%;
    height: auto; margin: 0 auto 10px;
    filter: drop-shadow(0 0 18px var(--pitland-green-glow));
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; margin-bottom: 16px;
  }
  label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
    font-weight: 600; transition: color 0.15s;
  }
  label.empty-required { color: #ff4d4d; }
  .info-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--pitland-green); color: #000;
    font-size: 13px; font-weight: 700;
    cursor: pointer; user-select: none;
    flex-shrink: 0;
  }
  .info-icon:active { transform: scale(0.94); }

  input[type="text"], input[type="number"], select {
    width: 100%; padding: 14px 16px;
    background: var(--card-input); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 17px; outline: none;
    -webkit-appearance: none; appearance: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    border-color: var(--pitland-green);
    box-shadow: 0 0 0 3px var(--pitland-green-glow);
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23c6ff00' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat; background-position: right 16px center;
    padding-right: 40px;
  }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .hint-text {
    font-size: 12px; color: var(--muted); margin-top: 4px;
  }

  .file-area {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 28px 20px; text-align: center;
    background: var(--card-input); transition: all 0.2s; cursor: pointer;
  }
  .file-area.has-file {
    border-color: var(--pitland-green); border-style: solid;
    background: #0e1400; box-shadow: 0 0 0 3px var(--pitland-green-glow);
  }
  .file-area .icon { font-size: 42px; margin-bottom: 8px; }
  .file-area .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .file-name { font-size: 15px; word-break: break-all; }
  input[type="file"] { display: none; }
  .file-btn {
    display: inline-block; padding: 10px 18px; margin-top: 12px;
    background: #222226; color: var(--text);
    border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .file-area.has-file .file-btn {
    background: var(--pitland-green); color: #000; font-weight: 600;
  }

  button.submit {
    width: 100%; padding: 17px;
    background: var(--pitland-green); color: #000;
    border: none; border-radius: 12px;
    font-size: 18px; font-weight: 700; letter-spacing: 0.3px;
    cursor: pointer; margin-top: 10px;
    transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
    box-shadow: 0 0 0 0 var(--pitland-green-glow);
  }
  button.submit:not(:disabled) { box-shadow: 0 4px 24px var(--pitland-green-glow); }
  button.submit:disabled {
    background: #3a3a3f; color: #888; cursor: not-allowed; box-shadow: none;
  }
  button.submit:active:not(:disabled) {
    background: var(--pitland-green-dark); transform: scale(0.99);
  }

  .status {
    margin-top: 16px; padding: 14px 16px;
    border-radius: 10px; font-size: 14px; display: none; line-height: 1.4;
  }
  .status.show { display: block; }
  .status.info { background: #12160a; color: var(--pitland-green); border: 1px solid #3a4a0a; }
  .status.ok   { background: #152200; color: var(--pitland-green); border: 1px solid var(--pitland-green-dark); }
  .status.err  { background: #2a0e0e; color: #f5a0a0; border: 1px solid #c62828; }
  .status.warn { background: #2a2410; color: #f5d97a; border: 1px solid #c69828; }

  .progress {
    height: 8px; background: #1e1e22; border-radius: 4px;
    overflow: hidden; margin-top: 12px; display: none;
  }
  .progress.show { display: block; }
  .progress-bar {
    height: 100%; background: var(--pitland-green); width: 0%;
    transition: width 0.2s; box-shadow: 0 0 12px var(--pitland-green-glow);
  }

  /* Modal — seznam zkratek */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7); z-index: 1000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; max-width: 480px; width: 100%;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-content h3 {
    margin: 0 0 14px; color: var(--pitland-green); font-size: 18px;
  }
  .modal-content #peopleSearch {
    width: 100%; margin-bottom: 14px;
  }
  .modal-content ul {
    list-style: none; padding: 0; margin: 0 0 14px;
  }
  .modal-content li {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 15px; cursor: pointer;
  }
  .modal-content li:hover { background: #1a1a1d; }
  .modal-content li strong {
    color: var(--pitland-green); font-family: ui-monospace, monospace;
    margin-right: 10px; min-width: 50px; display: inline-block;
  }
  .modal-close {
    width: 100%; padding: 12px;
    background: var(--pitland-green); color: #000;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="pitland_logo.png" alt="Pitland" class="logo">
    <p>Nahrání záznamu porady nebo trénínku</p>
  </header>

  <form id="uploadForm" class="card" novalidate>
    <div class="field">
      <label for="jmeno" id="jmenoLabel">
        Kdo nahrává? (zkratka)
        <span class="info-icon" id="jmenoInfo" title="Seznam zkratek">i</span>
      </label>
      <input type="text" id="jmeno" name="jmeno" placeholder="např. JNo" autocomplete="off" autocapitalize="none">
      <div class="hint-text">Tvoje zkratka (např. JNo, TZa, PSe)</div>
    </div>

    <div class="field">
      <label for="druh" id="druhLabel">Druh nahrávky</label>
      <select id="druh" name="druh">
        <option value="">— vyber —</option>
        <option value="briefing">Briefing</option>
        <option value="debriefing">Debriefing</option>
        <option value="meeting-1-1">Meeting 1:1</option>
        <option value="zpetna-vazba">Zpětná vazba</option>
        <option value="porada">Porada</option>
        <option value="jine">Jiné</option>
      </select>
    </div>

    <div class="field">
      <label for="datum" id="datumLabel">Datum nahrávky</label>
      <input type="date" id="datum" name="datum">
      <div class="hint-text">Defaultně dnes. Změň pokud nahráváš zpětně (čas bude 12:00).</div>
    </div>

    <div class="field" id="pocetField" style="display:none;">
      <label for="pocet" id="pocetLabel">Počet účastníků celkem (vč. tebe)</label>
      <input type="number" id="pocet" name="pocet" min="1" max="12" placeholder="3" inputmode="numeric">
    </div>

    <div class="field" id="skymField" style="display:none;">
      <label for="skym" id="skymLabel">
        Ostatní účastníci (zkratky)
        <span class="info-icon" id="skymInfo" title="Seznam zkratek">i</span>
      </label>
      <input type="text" id="skym" name="skym" placeholder="např. TZa, PSe" autocomplete="off" autocapitalize="none">
      <div class="hint-text" id="skymHint">CSV zkratek kromě tebe (např. TZa, PSe)</div>
    </div>

    <div class="field" id="popisField" style="display:none;">
      <label for="popis" id="popisLabel">Krátký popis</label>
      <input type="text" id="popis" name="popis" placeholder="např. koučink, stížnost zákazníka…" autocomplete="off">
    </div>

    <div class="field">
      <label id="fileLabel">Zvukový soubor</label>
      <label for="fileInput" class="file-area" id="fileArea">
        <div class="icon">🎤</div>
        <div class="file-name" id="fileName">Klepni pro výběr nahrávky</div>
        <div class="hint">.m4a, .mp3, .wav, .aac</div>
        <span class="file-btn">Vybrat soubor</span>
      </label>
      <input type="file" id="fileInput" name="file" accept="audio/*">
    </div>

    <button type="button" class="submit" id="submitBtn">Nahrát na Drive</button>

    <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status" id="status"></div>
  </form>

  <footer>Pitland · v1.37</footer>
</div>

<!-- Modal: seznam zkratek -->
<div class="modal-overlay" id="peopleModal">
  <div class="modal-content">
    <h3>📋 Seznam zkratek</h3>
    <input type="text" id="peopleSearch" placeholder="Hledat zkratku nebo jméno…" autocomplete="off">
    <ul id="peopleList">
      <li>Načítám…</li>
    </ul>
    <button class="modal-close" id="peopleModalClose">Zavřít</button>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(err => console.warn('[SW] Registrace selhala:', err));
  }

  // ── Sdílení přes IndexedDB ───────────────────────────────────────────────
  function nactiSdilenySoubor() {
    return new Promise((resolve) => {
      const dbReq = indexedDB.open('pitland-share', 1);
      dbReq.onupgradeneeded = (e) => {
        if (!e.target.result.objectStoreNames.contains('soubory'))
          e.target.result.createObjectStore('soubory');
      };
      dbReq.onsuccess = (e) => {
        const db = e.target.result;
        try {
          const tx = db.transaction('soubory', 'readwrite');
          const req = tx.objectStore('soubory').get('cekajici');
          req.onsuccess = () => {
            const file = req.result;
            if (file) {
              tx.objectStore('soubory').delete('cekajici');
              resolve(file);
            } else { resolve(null); }
          };
          req.onerror = () => resolve(null);
          tx.oncomplete = () => db.close();
        } catch (_) { resolve(null); }
      };
      dbReq.onerror = () => resolve(null);
    });
  }

  // ── Konfigurace ──────────────────────────────────────────────────────────
  const WEBHOOK_URL      = "https://script.google.com/macros/s/AKfycbzZLOlG9-ezkQ4wmym4ulsEmxt7BkAsrmR_tjFVQLO-_186rARBXwu1hyw14ApjleXI/exec";
  const TEMP_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz4pNkjjM0FBKUlCwVR97aiBWczlpL3fjw19Q7z8rDkP2xZVGVWASLmMxvx-6YXAuZb/exec";
  const MAX_SIZE_MB = 250;  // v1.22: input limit zvedly z 45 (po komprimi je vystup ~10 MB / hod)
  const MP3_KBPS    = 96;  // v1.31: 24->96 (48kHz potrebuje vyssi bitrate pro kvalitu reci)
  const MP3_SAMPLE_RATE = 48000;  // v1.31: 16kHz ROZBIJEL ElevenLabs diarizaci! 48kHz = OK (downsampling = spolknuta rec v audio_event)
  const MULTIPART_THRESHOLD_SEC = 3600;  // 60 min - nad timto delime
  const MULTIPART_CHUNK_SEC = 3000;       // 50 min chunky (Scribe ~4 min = bezpecne pod Apps Script 6 min limit)
  // v1.37: BINARY CHUNKED UPLOAD pro mobile (přeskoč MP3 konverzi → originál → 20MB chunky)
  const RAW_CHUNK_THRESHOLD_MB = 35;  // nad tohle používáme chunked path místo single POST (base64 50MB limit AS)
  const RAW_CHUNK_BIN_MB = 20;        // 20 MB binary slice = ~27 MB base64 JSON, dobře pod 50 MB AS limit

  // Default počet účastníků per druh
  const POCET_DEFAULT = {
    "briefing": 4, "debriefing": 4,
    "meeting-1-1": 2, "zpetna-vazba": 2,
    "porada": 6, "jine": 1
  };
  const SKYM_LABELS = {
    "meeting-1-1":  { label: "S kým (zkratka)",          placeholder: "např. TZa",       hint: "Jedna zkratka" },
    "zpetna-vazba": { label: "S kým (zkratka)",          placeholder: "např. TZa",       hint: "Jedna zkratka" },
    "briefing":     { label: "Účastníci kromě tebe",     placeholder: "např. TZa, PSe",  hint: "CSV zkratek" },
    "debriefing":   { label: "Účastníci kromě tebe",     placeholder: "např. TZa, PSe",  hint: "CSV zkratek" },
    "porada":       { label: "Ostatní účastníci porady", placeholder: "např. TZa, PSe, MDi", hint: "CSV zkratek" },
    "jine":         { label: "Ostatní účastníci",        placeholder: "např. TZa (volitelné)", hint: "CSV zkratek (nepovinné)" }
  };
  const DRUHY_S_KYM_REQUIRED = ["meeting-1-1", "zpetna-vazba", "briefing", "debriefing", "porada"];

  // ── DOM ─────────────────────────────────────────────────────────────────
  const form        = document.getElementById("uploadForm");
  const fileInput   = document.getElementById("fileInput");
  const fileArea    = document.getElementById("fileArea");
  const fileName    = document.getElementById("fileName");
  const submitBtn   = document.getElementById("submitBtn");
  const statusEl    = document.getElementById("status");
  const progress    = document.getElementById("progress");
  const progressBar = document.getElementById("progressBar");
  const druhSelect  = document.getElementById("druh");
  const datumInput  = document.getElementById("datum");
  const pocetField  = document.getElementById("pocetField");
  const pocetInput  = document.getElementById("pocet");
  const skymField   = document.getElementById("skymField");
  const skymInput   = document.getElementById("skym");
  const skymLabel   = document.getElementById("skymLabel");
  const skymHint    = document.getElementById("skymHint");
  const popisField  = document.getElementById("popisField");
  const popisInput  = document.getElementById("popis");
  const popisLabel  = document.getElementById("popisLabel");
  const jmenoInput  = document.getElementById("jmeno");
  const jmenoLabel  = document.getElementById("jmenoLabel");
  const druhLabel   = document.getElementById("druhLabel");
  const fileLabel   = document.getElementById("fileLabel");
  const peopleModal = document.getElementById("peopleModal");
  const peopleList  = document.getElementById("peopleList");
  const peopleSearch = document.getElementById("peopleSearch");

  let currentFile = null;
  let currentFileHash = null;  // v1.32: SHA-256 originálu pro detekci duplicit
  let currentMultipartMeta = null;  // v1.21: pro dlouhe nahravky (parent_recording_id, parts[], offsets[], durations[])
  let peopleCache = null;

  // ── Pole se mění podle druhu ─────────────────────────────────────────────
  function updateFieldsForDruh() {
    const v = druhSelect.value;
    if (v && SKYM_LABELS[v]) {
      const cfg = SKYM_LABELS[v];
      // Aktualizuj label (zachovej info ikonu)
      skymLabel.innerHTML = cfg.label + ' <span class="info-icon" id="skymInfo" title="Seznam zkratek">i</span>';
      document.getElementById("skymInfo").addEventListener("click", openPeopleModal);
      skymInput.placeholder = cfg.placeholder;
      skymHint.textContent = cfg.hint;
      skymField.style.display = "block";
      pocetField.style.display = "block";
      // Předvyplnit počet účastníků pokud je prázdné
      if (!pocetInput.value && POCET_DEFAULT[v]) {
        pocetInput.value = POCET_DEFAULT[v];
      }
    } else {
      skymField.style.display = "none";
      pocetField.style.display = "none";
      skymInput.value = "";
    }
    if (v === "jine") {
      popisField.style.display = "block";
    } else {
      popisField.style.display = "none";
      popisInput.value = "";
    }
    updateRequiredLabels();
  }
  druhSelect.addEventListener("change", updateFieldsForDruh);

  function updateRequiredLabels() {
    jmenoLabel.classList.toggle("empty-required", !jmenoInput.value.trim());
    druhLabel.classList.toggle("empty-required", !druhSelect.value);
    if (skymField.style.display !== "none") {
      const required = DRUHY_S_KYM_REQUIRED.includes(druhSelect.value);
      skymLabel.classList.toggle("empty-required", required && !skymInput.value.trim());
    } else {
      skymLabel.classList.remove("empty-required");
    }
    if (popisField.style.display !== "none") {
      popisLabel.classList.toggle("empty-required", !popisInput.value.trim());
    } else {
      popisLabel.classList.remove("empty-required");
    }
    fileLabel.classList.toggle("empty-required", !currentFile);
  }
  jmenoInput.addEventListener("input", updateRequiredLabels);
  skymInput.addEventListener("input", updateRequiredLabels);
  popisInput.addEventListener("input", updateRequiredLabels);

  // ── Datum nahrávky default: dnes ──────────────────────────────────────────
  try {
    const d = new Date();
    const localISO = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    datumInput.value = localISO;
  } catch (e) { }

  // ── localStorage: zkratka SAM ────────────────────────────────────────────
  try {
    const savedZk = localStorage.getItem("pitland_zkratka") || localStorage.getItem("pitland_jmeno");
    if (savedZk) jmenoInput.value = savedZk;
  } catch (e) {}
  updateRequiredLabels();

  // ── Modal: seznam zkratek (s search) ─────────────────────────────────────
  async function openPeopleModal() {
    peopleModal.classList.add("show");
    peopleSearch.value = "";
    peopleSearch.focus();
    if (!peopleCache) {
      peopleList.innerHTML = "<li>Načítám…</li>";
      try {
        const r = await fetch(WEBHOOK_URL + "?action=people");
        const data = await r.json();
        if (data.ok && data.people) {
          peopleCache = data.people;
          renderPeopleList("");
        } else {
          peopleList.innerHTML = "<li>Chyba: " + (data.error || "neznámá") + "</li>";
        }
      } catch (err) {
        peopleList.innerHTML = "<li>Chyba: " + err.message + "</li>";
      }
    } else {
      renderPeopleList("");
    }
  }
  function renderPeopleList(filter) {
    if (!peopleCache) return;
    const f = (filter || "").toLowerCase().trim();
    const sorted = Object.keys(peopleCache).sort();
    const filtered = sorted.filter(zk => 
      !f || zk.toLowerCase().includes(f) || peopleCache[zk].toLowerCase().includes(f)
    );
    if (filtered.length === 0) {
      peopleList.innerHTML = "<li>Žádný výsledek</li>";
      return;
    }
    peopleList.innerHTML = filtered.map(zk => 
      '<li data-zkratka="' + zk + '"><strong>' + zk + '</strong>' + peopleCache[zk] + '</li>'
    ).join("");
    // Klik na řádek = vloží zkratku do aktuálně focusnutého inputu
    Array.from(peopleList.querySelectorAll("li")).forEach(li => {
      li.addEventListener("click", () => {
        const zk = li.getAttribute("data-zkratka");
        if (!zk) return;
        // Vlož do jmeno pokud je prázdné, jinak do skym (jako CSV)
        if (!jmenoInput.value.trim()) {
          jmenoInput.value = zk;
        } else {
          const cur = skymInput.value.trim();
          skymInput.value = cur ? cur + ", " + zk : zk;
        }
        updateRequiredLabels();
        closePeopleModal();
      });
    });
  }
  peopleSearch.addEventListener("input", () => renderPeopleList(peopleSearch.value));
  document.getElementById("peopleModalClose").addEventListener("click", closePeopleModal);
  function closePeopleModal() { peopleModal.classList.remove("show"); }
  document.getElementById("jmenoInfo").addEventListener("click", openPeopleModal);
  document.getElementById("skymInfo").addEventListener("click", openPeopleModal);
  peopleModal.addEventListener("click", (e) => {
    if (e.target === peopleModal) closePeopleModal();
  });

  // ── Konverze M4A → MP3 ──────────────────────────────────────────────────
  async function convertToMp3(file) {
    if (/\.mp3$/i.test(file.name)) return file;
    showStatus('info', '🔄 Konvertuji na MP3… 0 %');
    submitBtn.disabled = true;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();
      let audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      audioCtx.close();
      // v1.31: resample na MP3_SAMPLE_RATE (48 kHz) mono - 16kHz rozbijel ElevenLabs diarizaci
      showStatus('info', 'Resampluji na 48 kHz mono...');
      const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const targetLen  = Math.ceil(audioBuffer.duration * MP3_SAMPLE_RATE);
      let offlineCtx   = new OfflineCtx(1, targetLen, MP3_SAMPLE_RATE);
      let src          = offlineCtx.createBufferSource();
      src.buffer       = audioBuffer;
      src.connect(offlineCtx.destination);
      src.start(0);
      let resampled    = await offlineCtx.startRendering();
      const mono       = new Float32Array(resampled.getChannelData(0));  // copy out
      // v1.22: uvolneni reference na velke buffery (Safari iOS memory hygiena)
      src.disconnect();
      src = null;
      audioBuffer = null;
      offlineCtx = null;
      resampled = null;
      // give GC a chance
      await new Promise(function(r) { setTimeout(r, 50); });
      const durSec     = mono.length / MP3_SAMPLE_RATE;
      function f32ToI16(buf) {
        const out = new Int16Array(buf.length);
        for (let i = 0; i < buf.length; i++) {
          const s = Math.max(-1, Math.min(1, buf[i]));
          out[i] = s < 0 ? s * 32768 : s * 32767;
        }
        return out;
      }

      // v1.21: encode helper - PCM Int16 -> MP3 chunks
      async function encodePartToMp3(monoI16, statusLabel) {
        const mp3enc    = new lamejs.Mp3Encoder(1, MP3_SAMPLE_RATE, MP3_KBPS);
        const BLOCK     = 1152;
        const CHUNK     = 50;
        const mp3chunks = [];
        const total     = Math.ceil(monoI16.length / BLOCK);
        await new Promise((resolve) => {
          let b = 0;
          function tick() {
            const end = Math.min(b + CHUNK, total);
            for (; b < end; b++) {
              const buf = mp3enc.encodeBuffer(monoI16.subarray(b * BLOCK, (b + 1) * BLOCK));
              if (buf.length > 0) mp3chunks.push(buf);
            }
            const pct = Math.round(b / total * 100);
            showStatus('info', '🔄 Konvertuji na MP3 ' + statusLabel + '… ' + pct + ' %');
            if (b < total) { setTimeout(tick, 0); } else {
              const flush = mp3enc.flush();
              if (flush.length > 0) mp3chunks.push(flush);
              resolve();
            }
          }
          setTimeout(tick, 0);
        });
        return new Blob(mp3chunks, { type: 'audio/mp3' });
      }

      const origMb  = (file.size / 1024 / 1024).toFixed(1);
      const baseName = file.name.replace(/\.[^.]+$/, '');

      if (durSec <= MULTIPART_THRESHOLD_SEC) {
        // Standardní single-file flow
        const monoI16 = f32ToI16(mono);
        const blob    = await encodePartToMp3(monoI16, '');
        const mp3File = new File([blob], baseName + '.mp3', { type: 'audio/mp3' });
        const mp3Mb   = (mp3File.size / 1024 / 1024).toFixed(1);
        showStatus('info', '✔ Konverze hotova: ' + origMb + ' MB → ' + mp3Mb + ' MB (MP3 96 kbps mono 48 kHz)');
        submitBtn.disabled = false;
        currentMultipartMeta = null;
        return mp3File;
      }

      // v1.21: MULTIPART — audio > 60 min → split na chunky 50 min
      const N = Math.ceil(durSec / MULTIPART_CHUNK_SEC);
      const minutesTotal = Math.round(durSec / 60);
      showStatus('info', '📂 Velky zaznam (' + minutesTotal + ' min) - rozdeluji na ' + N + ' casti...');
      const parentId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('mp_' + Date.now() + '_' + Math.random().toString(36).slice(2));
      const parts = [];
      const offsets = [];
      const durations = [];
      let totalMp3Bytes = 0;
      for (let i = 0; i < N; i++) {
        const startSample = i * MULTIPART_CHUNK_SEC * MP3_SAMPLE_RATE;
        const endSample   = Math.min((i + 1) * MULTIPART_CHUNK_SEC * MP3_SAMPLE_RATE, mono.length);
        const partMono    = mono.subarray(startSample, endSample);
        const partI16     = f32ToI16(partMono);
        const partBlob    = await encodePartToMp3(partI16, '(cast ' + (i + 1) + '/' + N + ')');
        const partName    = baseName + '_part' + (i + 1) + 'of' + N + '.mp3';
        parts.push(new File([partBlob], partName, { type: 'audio/mp3' }));
        offsets.push(i * MULTIPART_CHUNK_SEC);
        durations.push((endSample - startSample) / MP3_SAMPLE_RATE);
        totalMp3Bytes += partBlob.size;
      }
      const totalMp3Mb = (totalMp3Bytes / 1024 / 1024).toFixed(1);
      showStatus('info', '✔ Konverze hotova: ' + origMb + ' MB → ' + totalMp3Mb + ' MB v ' + N + ' castech (MP3 24 kbps mono 16 kHz)');
      submitBtn.disabled = false;
      currentMultipartMeta = { parentId: parentId, parts: parts, offsets: offsets, durations: durations, partCount: N };
      return parts[0];
    } catch (err) {
      showStatus('err', '❌ Konverze selhala: ' + err.message + ' — nahrávám originál.');
      submitBtn.disabled = false;
      return file;
    }
  }

  async function sha256Hex(file) {
    try {
      const buf = await file.arrayBuffer();
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    } catch (e) { console.warn('sha256 failed', e); return null; }
  }
  // v1.33: lightweight duration probe (jen metadata, bez decode/resample)
  async function probeDuration(file) {
    return new Promise(function(resolve) {
      try {
        const audio = document.createElement('audio');
        audio.preload = 'metadata';
        const url = URL.createObjectURL(file);
        audio.src = url;
        audio.onloadedmetadata = function() {
          const d = audio.duration;
          URL.revokeObjectURL(url);
          resolve(isFinite(d) ? d : null);
        };
        audio.onerror = function() {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        // Bezpečnostní timeout 5s — pokud metadata nepřijdou, neblokuj
        setTimeout(function() { try { URL.revokeObjectURL(url); } catch(e){} resolve(null); }, 5000);
      } catch (e) { resolve(null); }
    });
  }
  async function setFile(file) {
    const durSec = await probeDuration(file);
    const sizeMbRaw = file.size / 1024 / 1024;
    const isMobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);

    // v1.35: spočítej hash ORIGINÁLU (před konverzí) pro detekci duplicit
    currentFileHash = await sha256Hex(file);

    // v1.35: MOBILE BYPASS — Safari iOS spadne při decodeAudioData() pro >30 min audio
    // (1.5h M4A → ~1 GB RAM po dekódu → out of memory). Scribe akceptuje M4A/WAV/AAC
    // přímo, takže konverzi přeskakujeme a server soubor zpracuje jak je.
    const mobileLong = isMobile && ((durSec && durSec > 1800) || sizeMbRaw > 30);
    if (mobileLong) {
      // v1.37: Chunked upload nahoře (RAW_CHUNK_THRESHOLD_MB) zvedá strop na ~MAX_SIZE_MB.
      // Hard limit zachováváme jen na 100 MB (přes 4 hodiny voice memo) z bezpečnostních důvodů.
      if (sizeMbRaw > 100) {
        showStatus("err",
          "❌ Soubor (" + sizeMbRaw.toFixed(1) + " MB) je moc velký. Limit 100 MB.\n" +
          "Pro tak dlouhé nahrávky použij desktop, kde proběhne komprese."
        );
        return;
      }
      const minutes = durSec ? Math.round(durSec / 60) : null;
      const minMsg = minutes ? (minutes + " min, ") : "";
      const ext = (file.name.split('.').pop() || 'audio').toUpperCase();
      const ok = confirm(
        "📱 Mobilní upload: " + minMsg + sizeMbRaw.toFixed(1) + " MB\n\n" +
        "Soubor pošlu BEZ konverze (originál " + ext + ").\n" +
        "Konverze v prohlížeči by spadla na paměti.\n\n" +
        "Server přepis zpracuje na pozadí (cca 5-10 min).\n\n" +
        "Pokračovat?"
      );
      if (!ok) { showStatus("err", "Upload zrušen."); return; }
      currentFile = file;  // SKIP convertToMp3
      currentMultipartMeta = null;
      const sizeMb = sizeMbRaw.toFixed(1);
      fileName.textContent = currentFile.name + " (" + sizeMb + " MB · originál)";
      fileArea.classList.add("has-file");
      updateRequiredLabels();
      showStatus("info", "✔ Připraveno (bez konverze). Vyplň pole a odešli.");
      return;
    }

    // Desktop / krátký soubor: standardní MP3 konverze
    if (durSec && durSec > 3600) {
      const minutes = Math.round(durSec / 60);
      const parts = Math.ceil(durSec / MULTIPART_CHUNK_SEC);
      const msg = "⚠️ Dlouhá nahrávka: " + minutes + " min (~" + parts + " části)\n\n" +
        "Soubor se rozdělí na " + parts + " částí (~50 min každá) a nahraje postupně.\nMůže to trvat 5-10 min.\n\nPokračovat?";
      if (!confirm(msg)) {
        showStatus("err", "Upload zrušen.");
        return;
      }
    }
    currentFile = await convertToMp3(file);
    const sizeMb = (currentFile.size / 1024 / 1024).toFixed(1);
    fileName.textContent = currentFile.name + " (" + sizeMb + " MB)";
    fileArea.classList.add("has-file");
    updateRequiredLabels();
  }

  // ── Sdílení ?shared=1 ────────────────────────────────────────────────────
  if (location.search.includes('shared=1')) {
    nactiSdilenySoubor().then(async file => {
      if (!file) return;
      await setFile(file);
      if (!statusEl.classList.contains('err'))
        showStatus("info", "✔ Nahrávka načtena. Vyplň zbývající pole a odešli.");
    });
  }

  // ── ?load=ID (iOS Zkratka) ───────────────────────────────────────────────
  const loadId = new URLSearchParams(location.search).get('load');
  if (loadId) {
    (async function pollTempFile() {
      const MAX_ATTEMPTS = 20;
      const DELAY_MS = 2000;
      showStatus('info', '⏳ Načítám nahrávku ze Zkratky… (1/' + MAX_ATTEMPTS + ')');
      for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        try {
          const r      = await fetch(TEMP_WEBHOOK_URL + '?id=' + encodeURIComponent(loadId));
          const result = await r.json();
          if (result.ok && result.data) {
            const bytes = Uint8Array.from(atob(result.data), c => c.charCodeAt(0));
            const raw   = new File([bytes], result.filename || 'nahravka.m4a', { type: result.mimeType || 'audio/m4a' });
            await setFile(raw);
            if (!statusEl.classList.contains('err'))
              showStatus('info', '✔ Nahrávka načtena. Vyplň jméno a druh a odešli.');
            history.replaceState(null, '', location.pathname);
            return;
          }
          if (attempt < MAX_ATTEMPTS) {
            showStatus('info', '⏳ Načítám nahrávku ze Zkratky... (' + (attempt+1) + '/' + MAX_ATTEMPTS + ')');
            await new Promise(res => setTimeout(res, DELAY_MS));
          }
        } catch (err) {
          if (attempt < MAX_ATTEMPTS) await new Promise(res => setTimeout(res, DELAY_MS));
        }
      }
      showStatus('err', '❌ Nepodařilo se načíst nahrávku ze Zkratky (vypřel časový limit).');
    })();
  }

  // ── ?paste=YYYYMMDD (iOS Zkratka přes schránku) — varianta z v1.10 ────────
  // Banner + tlačítko se vloží NAD formulář, takže je hned vidět po otevření.
  const _pp = new URLSearchParams(location.search);
  const pasteId = _pp.get('paste') || '';
  if (_pp.has('paste')) {
    const pasteWrap = document.createElement('div');
    pasteWrap.style.cssText = 'margin-bottom:16px;';
    pasteWrap.innerHTML =
      '<div style="background:#12160a;border:1px solid #3a4a0a;border-radius:12px;' +
      'padding:16px 18px;margin-bottom:8px;color:var(--pitland-green);font-size:15px;text-align:center;">' +
      '📋 Nahrávka je ve schránce. Klepni na tlačítko.</div>' +
      '<button type="button" id="pasteBtn" style="width:100%;padding:17px;' +
      'background:var(--pitland-green);color:#000;border:none;border-radius:12px;' +
      'font-size:18px;font-weight:700;cursor:pointer;">Načíst nahrávku ze schránky</button>';
    const formCard = document.querySelector('.card');
    formCard.parentNode.insertBefore(pasteWrap, formCard);
    document.getElementById('pasteBtn').onclick = async function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Načítám...';
      try {
        const b64   = await navigator.clipboard.readText();
        if (!b64 || b64.length < 100) throw new Error('Schránka neobsahuje platná data.');
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const raw   = new File([bytes], 'nahravka_' + (pasteId || Date.now()) + '.m4a', { type: 'audio/m4a' });
        await setFile(raw);
        history.replaceState(null, '', location.pathname);
        pasteWrap.remove();
      } catch (err) {
        showStatus('err', '❌ Nepodařilo se přečíst schránku: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Zkusit znovu';
      }
    };
  }

  // ── Přímý výběr souboru ───────────────────────────────────────────────────
  fileInput.addEventListener("change", async () => {
    if (fileInput.files && fileInput.files[0]) {
      const f = fileInput.files[0];
      if (f.size > MAX_SIZE_MB * 1024 * 1024) {
        showStatus("err", "Soubor je moc velký (" + (f.size/1024/1024).toFixed(1) + " MB). Limit je " + MAX_SIZE_MB + " MB.");
        return;
      }
      // v1.22: mobile memory warning - decodeAudioData potrebuje ~22x file size v RAM
      const isMobileSafari = /iPhone|iPad|iPod/.test(navigator.userAgent);
      if (isMobileSafari && f.size > 35 * 1024 * 1024) {
        showStatus("warn", "Velký soubor (" + (f.size/1024/1024).toFixed(1) + " MB) na mobilu — Safari muze pri konverzi spadnout (pamet). Doporucuji desktop browser pro nahravky > 30 MB.");
      }
      await setFile(f);
    }
    updateRequiredLabels();
  });

  function showStatus(type, msg) {
    statusEl.className = "status show " + type;
    statusEl.textContent = msg;
  }
  function hideStatus() { statusEl.className = "status"; }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result.toString();
        resolve(result.slice(result.indexOf(",") + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ── Odeslání ─────────────────────────────────────────────────────────────
  submitBtn.addEventListener("click", async () => {
    hideStatus();
    if (!currentFile) { showStatus("err", "Nejdřív vyber zvukový soubor."); return; }
    if (currentFile.size > MAX_SIZE_MB * 1024 * 1024) { showStatus("err", "Soubor je moc velký. Limit " + MAX_SIZE_MB + " MB."); return; }

    const jmeno = jmenoInput.value.trim();
    const druh  = druhSelect.value;
    const skymRaw = skymInput.value.trim();
    const popis = popisInput.value.trim();
    const pocet = parseInt(pocetInput.value, 10);

    if (!jmeno || !druh) {
      showStatus("err", "Vyplň zkratku SAMa a druh nahrávky.");
      updateRequiredLabels();
      return;
    }
    if (DRUHY_S_KYM_REQUIRED.includes(druh) && !skymRaw) {
      showStatus("err", "Vyplň ostatní účastníky.");
      updateRequiredLabels();
      return;
    }
    if (druh === "jine" && !popis) {
      showStatus("err", "Vyplň krátký popis (bude součástí názvu souboru).");
      updateRequiredLabels();
      return;
    }

    // Slož speakers CSV: SAM + ostatní (z skymRaw rozparsuj a vyčisti)
    const ostatniList = skymRaw
      ? skymRaw.split(",").map(s => s.trim()).filter(Boolean)
      : [];
    const speakersList = [jmeno, ...ostatniList];
    const speakersCSV = speakersList.join(", ");
    // num_speakers = max(pocet z PWA, počet zkratek). Pokud user nezadal pocet, použij length.
    const numSpeakers = pocet && pocet > 0 ? pocet : speakersList.length;
    // Pro filename: skym = first ostatní zkratka (pro kratší filename) nebo joined dash
    const skymForFilename = ostatniList.length > 0
      ? ostatniList.join("-")
      : "";

    try { localStorage.setItem("pitland_zkratka", jmeno); } catch (e) {}

    // v1.32: detekce duplicit — pre-check podle hashe originálu + datum/druh/vedl
    let forceUpload = false;
    if (currentFileHash && !(currentMultipartMeta && currentMultipartMeta.partCount > 1)) {
      try {
        showStatus("info", "Kontroluji duplicity…");
        const dpParams = new URLSearchParams({ fn: "checkDuplicate", hash: currentFileHash, date: (datumInput.value || ""), druh: druh, vedl: jmeno });
        const dpR = await fetch(WEBHOOK_URL + "?" + dpParams.toString());
        const dp = await dpR.json();
        if (dp && dp.exact_dup) {
          if (!confirm("⚠️ Tato nahrávka už v systému JE:\n\n" + (dp.exact_name || "") + "\n\nStejný zvukový soubor byl už nahrán. Přesto nahrát znovu?")) {
            showStatus("err", "Upload zrušen — duplicita.");
            submitBtn.disabled = false; submitBtn.textContent = "Nahrát"; progress.classList.remove("show");
            return;
          }
          forceUpload = true;
        } else if (dp && dp.soft_dup) {
          if (!confirm("⚠️ Na " + (datumInput.value || "tento den") + " už existuje " + druh + " od " + jmeno + ":\n\n" + (dp.soft_names || []).join("\n") + "\n\nMůže jít o duplicitu. Přesto nahrát?")) {
            showStatus("err", "Upload zrušen — možná duplicita.");
            submitBtn.disabled = false; submitBtn.textContent = "Nahrát"; progress.classList.remove("show");
            return;
          }
        }
      } catch (e) { console.warn("dup check failed (continuing):", e); }
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Nahrávám…";
    progress.classList.add("show");
    progressBar.style.width = "15%";
    showStatus("info", "Připravuji soubor…");

    const uploadStartTs = Date.now();
    try {
      const basePayload = {
        jmeno: jmeno,
        druh: druh,
        skym: skymForFilename,
        popis: popis,
        speakers: speakersCSV,
        num_speakers: numSpeakers,
        mimeType: "audio/mp3",
        recording_date: datumInput.value || "",
        content_hash: currentFileHash || "",
        force: forceUpload
      };

      // v1.21: multipart upload path
      if (currentMultipartMeta && currentMultipartMeta.partCount > 1) {
        const meta = currentMultipartMeta;
        showStatus("info", "📤 Multipart upload: " + meta.partCount + " casti");
        for (let i = 0; i < meta.parts.length; i++) {
          const part = meta.parts[i];
          const partBase64 = await fileToBase64(part);
          const pctStart = 5 + Math.round((i / meta.partCount) * 90);
          progressBar.style.width = pctStart + "%";
          showStatus("info", "📤 Upload cast " + (i + 1) + "/" + meta.partCount + " (" + (part.size / 1024 / 1024).toFixed(1) + " MB)...");
          const partPayload = Object.assign({}, basePayload, {
            filename: part.name,
            data: partBase64,
            parent_recording_id: meta.parentId,
            part_index: i + 1,
            part_count: meta.partCount,
            part_offset_sec: meta.offsets[i],
            part_duration_sec: meta.durations[i]
          });
          const partRes = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(partPayload)
          });
          const partText = await partRes.text();
          let partResult;
          try { partResult = JSON.parse(partText); } catch (e) { partResult = { ok: false, error: partText }; }
          if (!(partRes.ok && partResult.ok)) {
            throw new Error("Cast " + (i + 1) + "/" + meta.partCount + " selhala: " + (partResult.error || partRes.status));
          }
          const pctEnd = 5 + Math.round(((i + 1) / meta.partCount) * 90);
          progressBar.style.width = pctEnd + "%";
        }
        progressBar.style.width = "100%";
        showStatus("ok", "✅ Vsech " + meta.partCount + " casti nahrano. Server zpracuje prepis (~" + (5 + meta.partCount * 4) + " min) a posle email.");
        submitBtn.textContent = "Nahrát další";
        fileInput.value = "";
        currentFile = null;
        currentMultipartMeta = null;
        fileName.textContent = "Klepni pro výběr nahrávky";
        fileArea.classList.remove("has-file");
        updateRequiredLabels();
        return;
      }

      // v1.37: BINARY CHUNKED UPLOAD — pro originály >35 MB (mobile bypass MP3 konverze)
      // base64 v JSON body má 33% overhead, takže 48 MB binary → 64 MB JSON → nad 50 MB limit AS.
      // Rozsekáme file.slice() na 20 MB binární kousky a posíláme každý jako menší JSON.
      const fileSizeMb = currentFile.size / 1024 / 1024;
      if (fileSizeMb > RAW_CHUNK_THRESHOLD_MB) {
        const parentId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ("rc_" + Date.now() + "_" + Math.random().toString(36).slice(2));
        const chunkSize = RAW_CHUNK_BIN_MB * 1024 * 1024;
        const totalChunks = Math.ceil(currentFile.size / chunkSize);
        showStatus("info", "📦 Velký soubor (" + fileSizeMb.toFixed(1) + " MB) — chunked upload " + totalChunks + " částí po " + RAW_CHUNK_BIN_MB + " MB...");
        let lastResult = null;
        for (let i = 0; i < totalChunks; i++) {
          const start = i * chunkSize;
          const end = Math.min(start + chunkSize, currentFile.size);
          const chunkBlob = currentFile.slice(start, end);
          const chunkSizeMb = (chunkBlob.size / 1024 / 1024).toFixed(1);
          showStatus("info", "📤 Část " + (i + 1) + "/" + totalChunks + " (" + chunkSizeMb + " MB)…");
          progressBar.style.width = (5 + (i / totalChunks) * 90) + "%";
          const chunkBase64 = await fileToBase64(chunkBlob);
          const chunkPayload = Object.assign({}, basePayload, {
            raw_chunk: true,
            raw_parent_id: parentId,
            raw_idx: i,
            raw_total: totalChunks,
            raw_original_name: currentFile.name,
            raw_original_size: currentFile.size,
            filename: currentFile.name,
            mimeType: currentFile.type || "audio/mp3",
            data: chunkBase64
          });
          const chunkRes = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(chunkPayload)
          });
          const chunkText = await chunkRes.text();
          let chunkResult;
          try { chunkResult = JSON.parse(chunkText); } catch (e) { chunkResult = { ok: false, error: chunkText }; }
          if (!chunkResult.ok) {
            throw new Error("Část " + (i + 1) + "/" + totalChunks + " selhala: " + (chunkResult.error || chunkRes.status));
          }
          lastResult = chunkResult;
        }
        progressBar.style.width = "100%";
        showStatus("ok", "✅ Audio nahráno chunkovaně (" + totalChunks + " částí, " + fileSizeMb.toFixed(1) + " MB).\n📝 Přepis se zpracuje na pozadí (~5-10 min). Email dorazí, až bude hotový.");
        submitBtn.textContent = "Nahrát další";
        fileInput.value = "";
        currentFile = null;
        currentMultipartMeta = null;
        fileName.textContent = "Klepni pro výběr nahrávky";
        fileArea.classList.remove("has-file");
        updateRequiredLabels();
        return;
      }

      // Single-file path (existing flow)
      const base64 = await fileToBase64(currentFile);
      progressBar.style.width = "45%";
      showStatus("info", "Odesílám na Drive… (může chvíli trvat)");
      const payload = Object.assign({}, basePayload, {
        filename: currentFile.name,
        mimeType: currentFile.type || "audio/mp3",
        data: base64
      });
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      progressBar.style.width = "90%";
      const text = await res.text();
      let result;
      try { result = JSON.parse(text); } catch (e) { result = { ok: false, error: text }; }
      if (res.ok && result.ok) {
        progressBar.style.width = "100%";
        if (result.async) {
          // v1.34: Server uložil audio, přepis poběží na pozadí přes processTranscribeQueue
          showStatus("ok", "✅ Audio nahráno: " + (result.filename || currentFile.name) + "\n📝 Přepis se zpracuje na pozadí (~5-10 min). Email dorazí, až bude hotový.");
        } else {
          showStatus("ok", "✅ Hotovo! Soubor uložen jako: " + (result.filename || currentFile.name));
        }
        submitBtn.textContent = "Nahrát další";
        fileInput.value = "";
        currentFile = null;
        currentMultipartMeta = null;
        fileName.textContent = "Klepni pro výběr nahrávky";
        fileArea.classList.remove("has-file");
        updateRequiredLabels();
      } else if (result && result.duplicate) {
        // v1.34: server-side duplicate detection (defense in depth)
        showStatus("err", "⚠️ DUPLICITA: " + (result.existing_name || "Tato nahrávka už v systému je."));
        submitBtn.disabled = false; submitBtn.textContent = "Nahrát"; progress.classList.remove("show");
        return;
      } else { throw new Error(result.error || ("HTTP " + res.status)); }
    } catch (err) {
      const elapsedSec = Math.round((Date.now() - (typeof uploadStartTs !== "undefined" ? uploadStartTs : Date.now())) / 1000);
      const msg = String(err && err.message || err || "");
      const isNetworkErr = /load failed|failed to fetch|network|aborted|timeout|abort/i.test(msg);

      let verified = false;
      if (isNetworkErr) {
        // v1.19: misto time-based hadani auto-overuj upload pres checkRecent
        showStatus("info", "⏳ Spojení selhalo po " + elapsedSec + " s — ověřuji upload na serveru…");
        try {
          const checkParams = new URLSearchParams({
            fn: "checkRecent",
            zkratka: jmeno,
            druh: druh
          });
          const recordingDate = datumInput.value || "";
          if (recordingDate) checkParams.set("recording_date", recordingDate);
          const checkR = await fetch(WEBHOOK_URL + "?" + checkParams.toString());
          const checkData = await checkR.json().catch(() => ({}));
          if (checkData && checkData.ok && checkData.found && checkData.matches && checkData.matches.length > 0) {
            const m = checkData.matches[0];
            verified = true;
            progressBar.style.width = "100%";
            showStatus("ok", "✅ Hotovo (ověřeno i přes chybu spojení): " + (m.audio_file_name || ""));
            submitBtn.textContent = "Nahrát další";
            fileInput.value = "";
            currentFile = null;
            fileName.textContent = "Klepni pro výběr nahrávky";
            fileArea.classList.remove("has-file");
            updateRequiredLabels();
          }
        } catch (verifyErr) {
          // verify selhalo — fallback na warn
        }
        if (!verified) {
          progressBar.style.width = "100%";
          showStatus("warn",
            "⚠️ Spojení se přerušilo po " + elapsedSec + " s a ověření neuspělo. " +
            "Upload mohl proběhnout — zkontroluj Drive nebo zkus znovu za chvíli."
          );
          submitBtn.textContent = "Nahrát další";
          fileInput.value = "";
          currentFile = null;
          fileName.textContent = "Klepni pro výběr nahrávky";
          fileArea.classList.remove("has-file");
          updateRequiredLabels();
        }
      } else {
        showStatus("err", "❌ Chyba: " + msg);
      }
      progress.classList.remove("show");
      progressBar.style.width = "0%";
    } finally {
      submitBtn.disabled = false;
      if (submitBtn.textContent === "Nahrávám…") submitBtn.textContent = "Nahrát na Drive";
    }
  });
</script>
</body>
</html>
