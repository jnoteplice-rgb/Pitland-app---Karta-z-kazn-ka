<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rešerše + CRM — Sociální vůz ČČK Prachatice</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#1F4E5F;--brand2:#2c6e85;
--yes:#1E7D34;--maybe:#9C6500;--no:#9aa0a6;--yesbg:#e8f5ec;--maybebg:#fbf2e0;--nobg:#eef0f1;
--s-new:#6b7280;--s-mail:#2563eb;--s-call:#9C6500;--s-meet:#7c3aed;--s-deal:#1E7D34;--s-no:#b91c1c;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{display:flex;min-height:100vh}
.side{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
.side-head{padding:18px 16px 12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.side-head h1{font-size:15px;margin:0 0 3px}
.side-head p{font-size:11px;margin:0;opacity:.9}
.searchbox{padding:10px 12px;border-bottom:1px solid var(--line)}
.searchbox input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.chip{font-size:11px;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pipe{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:10px}
.pipe div{text-align:center;border-radius:6px;padding:5px 2px;font-weight:700;background:#f1f5f7;color:#444}
.pipe b{display:block;font-size:14px}
.navlist{list-style:none;margin:0;padding:8px}
.navlist li{margin:2px 0}
.navlist button{width:100%;text-align:left;border:1px solid transparent;background:none;padding:9px 11px;border-radius:10px;cursor:pointer;display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink)}
.navlist button:hover{background:#f3f6f8}
.navlist button.active{background:#eaf1f4;border-color:#cfe0e6}
.navnum{width:21px;height:21px;flex:0 0 21px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.navtxt{flex:1;min-width:0}
.navtxt .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navtxt .sg{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.main{flex:1;min-width:0;padding:24px 32px 60px;max-width:1000px}
.syncbar{display:flex;align-items:center;gap:10px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px}
.syncbar .dotc{width:9px;height:9px;border-radius:50%}
.syncbar input{flex:1;min-width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px}
.syncbar button{border:1px solid var(--brand);background:#fff;color:var(--brand);font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
h2.cn{font-size:23px;margin:0 0 2px}
.badge{font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px;white-space:nowrap}
.badge.yes{background:var(--yesbg);color:var(--yes)}.badge.maybe{background:var(--maybebg);color:var(--maybe)}.badge.no{background:var(--nobg);color:#5f6368}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.meta div{font-size:13px}.meta .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:1px}
/* CRM panel */
.crm{margin:14px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.crm h3{margin:0 0 12px;font-size:14px;color:var(--brand);display:flex;align-items:center;gap:8px}
.crm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.crm-grid label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:3px}
.crm-grid select,.crm-grid input[type=date]{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
.crm-note{margin-top:12px}
.crm-note textarea{width:100%;min-height:54px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;resize:vertical}
.crm-foot{margin-top:10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.statuspill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:14px;color:#fff}
.tabs{display:flex;gap:4px;margin:20px 0 0;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;background:none;padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.tabwrap{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:22px 24px}
.tabpane{display:none}.tabpane.active{display:block}
.tabpane h3{font-size:15px;margin:0 0 10px;color:var(--brand)}.tabpane p{margin:0 0 10px;font-size:14px}
.tabpane ul{margin:0 0 12px;padding-left:20px;font-size:14px}.tabpane li{margin:4px 0}
.verdict-line{font-weight:800;font-size:15px;padding:8px 12px;border-radius:8px;display:inline-block;margin:0 0 12px}
.verdict-line.yes{background:var(--yesbg);color:var(--yes)}.verdict-line.maybe{background:var(--maybebg);color:var(--maybe)}.verdict-line.no{background:var(--nobg);color:#5f6368}
table.obj{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:13px}
table.obj th{background:#f1f5f7;text-align:left;padding:8px 10px;border:1px solid var(--line);font-size:12px}
table.obj td{padding:8px 10px;border:1px solid var(--line);vertical-align:top}
table.obj td:first-child{width:34%;font-weight:600;color:#444}
ol.steps{margin:0;padding-left:18px;font-size:14px}ol.steps li{margin:0 0 12px}
.hint{font-size:12px;color:var(--muted);font-style:italic;border-left:3px solid var(--line);padding-left:10px;margin-top:12px}
.email-box{background:#fbfdfe;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.email-head{display:flex;justify-content:space-between;align-items:center;background:#eef4f6;padding:10px 14px;border-bottom:1px solid var(--line)}
.email-subj{font-size:13px;font-weight:700}
.copybtn{border:1px solid var(--brand);background:#fff;color:var(--brand);font-size:12px;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600}
.email-body{padding:14px 16px;white-space:pre-wrap;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.6}
.noemail{background:var(--nobg);border-radius:10px;padding:14px 16px;font-size:13.5px;color:#5f6368}
.src{list-style:none;padding:0;margin:0;font-size:13px}.src li{margin:6px 0}.src a{color:var(--brand2);text-decoration:none}
.footer-note{font-size:11px;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:880px){.wrap{flex-direction:column}.side{width:100%;height:auto;position:relative;flex:none}.main{padding:18px}}
</style>
</head>

<script>
const DATA = [{"id": 1, "name": "Bytové družstvo Přátelství PT", "ico": "26110547", "address": "nám. Přátelství 664, Prachatice II, 383 01", "contact": "Ing. Irena Plecerová (předsedkyně), Jaroslava Ženíšková, Adolf P. — bez veřejného kontaktu", "segment": "Nemovitosti / správa bytového domu", "founded": "2006", "verdict": "NEOSLOVIT", "vclass": "no", "score": "1/10", "research": "\n<p><strong>Co to je:</strong> Samospráva jediného panelového bytového domu na sídlišti Prachatice II (č.p. 664). Vzniklo pravděpodobně privatizací bytového fondu po roce 2000, sídlí přímo v domě, který spravuje. Žádná komerční ani výrobní činnost.</p>\n<p><strong>Předmět činnosti:</strong> přidělování družstevních bytů, uzavírání nájmů, správa, údržba, opravy bytového fondu (NACE 6820 + 6920 účetnictví jako sekundární kód).</p>\n<p><strong>Příjmy:</strong> příspěvky členů-nájemníků na provoz a opravy domu — nikoli komerční zisk.</p>\n<p><strong>Online přítomnost:</strong> nulová — žádný web, sociální sítě, Google profil, recenze, mediální zmínky ani sponzoring. To je norma pro samosprávu jednoho domu.</p>\n<p><strong>Statutární orgán:</strong> tři sousedé-dobrovolníci (předsednictvo), kteří v domě pravděpodobně sami bydlí. Nejde o podnikatele a nemají žádný veřejný profil.</p>\n<p><strong>Stav v registrech:</strong> ROS/VR/RES aktivní, není v likvidaci ani insolvenci. Neplátce DPH.</p>\n", "recommendation": "\n<p class=\"verdict-line no\">Verdikt: NEOSLOVIT</p>\n<ul>\n<li><strong>Není to komerční firma.</strong> Bytové družstvo nemá produkty, brand ani zákazníky, které by potřebovalo zviditelňovat. Reklama pro ně nedává smysl.</li>\n<li><strong>Chybí motivace ke koupi.</strong> Výhody sociálního vozu (viditelnost, medializace, CSR, daňový náklad) cílí na firmy, které prodávají a budují jméno. Družstvo nic z toho nepotřebuje, a výdaj na reklamu by u nich nebyl daňově uznatelný (nesouvisí se zdanitelnými příjmy).</li>\n<li><strong>Rozhodovací struktura.</strong> Jakýkoli výdaj ze společného fondu schvaluje členská schůze nájemníků — průchodnost marketingového výdaje je prakticky nulová.</li>\n</ul>\n<p>Čas strávený oslovením by byl promarněný a nevhodné cílení snižuje věrohodnost prodejce.</p>\n", "email": null, "prep": "<p>Telefonát se nedoporučuje. Pokud by přesto došlo ke kontaktu, kontaktní osoba je předsedkyně Ing. Irena Plecerová; telefon ani e-mail nejsou veřejně dostupné. Použitelný hák neexistuje (žádný obchodní zájem, žádná CSR aktivita, žádná lokální značka).</p>", "script": "<p>Nevypracováno — telefonát k tomuto subjektu by byl ztrátou času i nevhodným zásahem do soukromí osob spravujících bytový dům.</p>", "sources": [["ARES — IČO 26110547", "https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/26110547"], ["Kurzy.cz — obchodní rejstřík", "https://rejstrik-firem.kurzy.cz/26110547/bytove-druzstvo-pratelstvi-pt/"], ["Kompakt — Sociální automobil", "http://www.kompakt-cr.cz/socialni-automobil/"]]}, {"id": 2, "name": "3CH CARGO s.r.o. v likvidaci", "ico": "03815986", "address": "Borová 774, Prachatice II, 383 01", "contact": "Likvidátor: Smrčka a Kubálek v.o.s., Praha (dříve Viktor a David Chocholouš)", "segment": "Autoservis (opravy vozidel)", "founded": "2015", "verdict": "NEOSLOVIT", "vclass": "no", "score": "0/10", "research": "\n<p><strong>Co to bylo:</strong> Autoservis (NACE 45200 — opravy a údržba motorových vozidel). Přes název „CARGO\" nešlo o dopravu. Historicky 5–10 mil. Kč obratu a 6–9 zaměstnanců (2015–2018), tedy malá regionální firma. Bez webu a sociálních sítí.</p>\n<p><strong>Klíčový nález — likvidace:</strong> firma je v <strong>soudně nařízené likvidaci od 15. 2. 2023</strong> (Krajský soud v Č. Budějovicích, sp. zn. 37 Cm 292/2022). Likvidátorem je profesionální subjekt <strong>Smrčka a Kubálek v.o.s.</strong> z Prahy. Statutární orgán (Viktor a David Chocholouš) už nemá oprávnění jednat za firmu.</p>\n<p><strong>Předhistorie:</strong> na obchodní podíly obou společníků byly od 25. 11. 2020 uvaleny <strong>exekuce</strong> (exekutor JUDr. Kocián, věřitel ČSOB Leasing) — jasný signál vážných finančních problémů 2–3 roky před likvidací.</p>\n<p><strong>Stav:</strong> firma fakticky neexistuje, probíhá vypořádání majetku s cílem výmazu z rejstříku.</p>\n", "recommendation": "\n<p class=\"verdict-line no\">Verdikt: NEOSLOVIT — vyřadit z pipeline</p>\n<ul>\n<li><strong>Firma nemá jednatele</strong> oprávněného podepsat smlouvu — vše dělá likvidátor, který nemá zájem o regionální marketing.</li>\n<li><strong>Žádná podnikatelská aktivita</strong> — reklamní plocha by neměla koho reprezentovat.</li>\n<li><strong>Prostředky patří věřitelům</strong> (ČSOB Leasing, exekutor), ne na reklamu. Uzavření takové smlouvy by bylo v rozporu se zákonnou povinností likvidátora.</li>\n</ul>\n<p>Tento záznam je ukázkou, proč je lustrace stavu firmy (likvidace/insolvence) povinný první krok rešerše.</p>\n", "email": null, "prep": "<p>Neaplikuje se — telefonát se nedoporučuje. Oslovení by působilo neprofesionálně vůči likvidátorovi i věřitelům.</p>", "script": "<p>Neaplikuje se.</p>", "sources": [["Peníze.cz — rejstřík 3CH CARGO", "https://rejstrik.penize.cz/03815986-3ch-cargo-s-r-o-v-likvidaci"], ["Kurzy.cz — 3CH CARGO", "https://rejstrik-firem.kurzy.cz/03815986/3ch-cargo-sro-v-likvidaci/"], ["Detail.cz — 3CH CARGO", "https://www.detail.cz/firma/3815986-3ch-cargo-sro-v-likvidaci-borova-774-prachatice/"]]}, {"id": 3, "name": "4 X Production CZ s.r.o.", "ico": "08858055", "address": "SNP 428, Prachatice II, 383 01", "contact": "Michal Piloušek (jednatel) — mobil 725 944 979, michal@xterra.cz", "segment": "Eventy, sport, cestovní ruch", "founded": "2020", "verdict": "OSLOVIT", "vclass": "yes", "score": "9/10", "research": "\n<p><strong>Co firma dělá:</strong> produkční/eventová entita — organizace sportovních a kulturních akcí, cestovní ruch, doprovodné vzdělávání a gastronomie (NACE 7911 cestovní agentury, 9319 sport, 9020 zábava, 8550 vzdělávání, 5610 stravování, 7311 reklama). Veškerá aktivita běží pod značkou <strong>XTERRA Czech</strong> a osobní značkou jednatele.</p>\n<p><strong>Jednatel Michal Piloušek</strong> (*1989, Prachatice) je jednou z nejvýraznějších osobností veřejného života v Prachaticích:</p>\n<ul>\n<li><strong>Production manager XTERRA Czech</strong> — nejstarší závod světového poháru XTERRA v Evropě, hostovaný v Prachaticích. 2024 ME XTERRA, 2025 ME Europe Triathlon Cross — historicky poprvé.</li>\n<li><strong>Radní města Prachatice</strong> (od 2022, hnutí Živé Prachatice) — období 2022–2026.</li>\n<li>Bývalý ředitel KIS Prachatice, spoluobnovitel Pivovaru Prachatice, zakladatel festivalu Mezibrány, aktivní muzikant a triatlonista.</li>\n</ul>\n<p><strong>Online:</strong> XTERRA Czech (web, FB, IG aktivní), osobní FB. Firma 4 X Production sama o sobě web nemá — je to právní entita za produkčním byznysem. Člen destinačního managementu PROŠumavsko.</p>\n<p><strong>CSR kontext:</strong> XTERRA aktivně pracuje se sponzory; Piloušek je tváří propojení Prachatic se sportem a turismem. Silná lokální hrdost.</p>\n", "recommendation": "\n<p class=\"verdict-line yes\">Verdikt: OSLOVIT — silný lead, personalizace je klíč</p>\n<ul>\n<li><strong>Rozumí viditelnosti a medializaci</strong> — celý jeho byznys stojí na přitažení závodníků, diváků a sponzorů do Prachatic. Sdílené logo s ČČK na regionálním voze je řeč, kterou mluví.</li>\n<li><strong>Radní = přirozený vztah k ČČK</strong> i k daňovým nástrojům; není to laik, který odmítne.</li>\n<li><strong>Lokální patriot</strong> — celý život buduje Prachatice jako sportovně-kulturní město; sociální vůz pro místní ČČK přesně sedí do jeho narativu.</li>\n</ul>\n<p><strong>Pozor:</strong> firma je malá (cena musí být v dosažitelné relaci); jako radní může chtít odlišit „soukromé\" rozhodnutí od „radničního\"; v období duben–červenec je ve vrcholu příprav XTERRA — volat mimo.</p>\n", "email": {"subject": "Prachatice na voze ČČK — na 4 roky v ulicích, s logem vaší firmy", "body": "Dobrý den, Michale,\n\njmenuji se [jméno], pracuji pro reklamní agenturu Kompakt z Prachatic.\n\nOslovuji Vás, protože vím, co pro Prachatice děláte — XTERRA Czech není jen závod, je to každý rok doklad toho, že tohle město umí světové věci. A právě proto mi přišlo správné obrátit se na Vás jako na jednoho z mála lidí, kteří v Prachaticích spojují byznys, sport a lokální identitu dohromady.\n\nMám pro Vás možnost, která sedí přesně do tohoto průniku: Oblastní spolek Českého červeného kříže Prachatice dostane nové vozidlo, které bude 4 roky jezdit po Prachaticku. Na voze je prostor pro logo jedné regionální firmy — s mediálním výstupem při předání (regionální tisk, rádio, přítomnost starosty) a jako daňově uznatelný náklad.\n\nVíte líp než kdokoli, co znamená mediální přítomnost a reputační propojení. A ČČK je značka s jednoznačně pozitivní asociací.\n\nMůžeme to probrat osobně, třeba 15 minut po telefonu? Jsem flexibilní.\n\nS pozdravem a přáním dalšího úspěšného ročníku XTERRY,\n[jméno] / [telefon] / [e-mail]"}, "prep": "\n<p><strong>Co vědět:</strong> volat mimo vrchol příprav XTERRA (duben–červenec). Rozhoduje jako soukromá osoba / jednatel, ne jako radní — nastavit hned na začátku. Firma je malá, ne korporace — funguje emoce „lokální hrdost + ČČK\". Marketing zná zevnitř, jde rovnou na hodnotu. Mobil 725 944 979.</p>\n<table class=\"obj\"><tr><th>Námitka</th><th>Odpověď</th></tr>\n<tr><td>„Nemáme rozpočet.\"</td><td>Tohle není dobročinnost, je to daňově uznatelný náklad — platíte za reklamu, co Vám 4 roky jezdí v regionu, kde děláte byznys.</td></tr>\n<tr><td>„Jako radní nemůžu spojovat soukromou firmu s městem.\"</td><td>To je v pořádku — rozhodujete jako jednatel 4 X Production, ne jako radní. ČČK je soukromý spolek, ne město.</td></tr>\n<tr><td>„S ČČK přijdu do styku málo.\"</td><td>Vůz jezdí po celém okrese 4 roky — logo vidí tisíce lidí, ne jen partneři ČČK. Jde o viditelnost v regionu, kam lákáte závodníky.</td></tr>\n<tr><td>„Mám jiné sponzorské závazky.\"</td><td>Tohle se nevylučuje — je to reklamní plocha, ne exkluzivita značky. Doplňuje Váš profil.</td></tr>\n</table>\n", "script": "\n<ol class=\"steps\">\n<li><strong>Otevření (20 s):</strong> „Dobrý den, Michale Piloušku? Tady [jméno] z reklamní agentury Kompakt z Prachatic. Volám kvůli jednomu regionálnímu projektu, ke kterému mi přišlo správné oslovit právě Vás — máte chvilku?\"</li>\n<li><strong>Hák — ČČK (30 s):</strong> „Pracujeme s Oblastním spolkem Červeného kříže Prachatice — jedno prachatické auto ponese logo místní firmy a pojede po regionu celé 4 roky. Hledám firmu, která tu má kořeny a jejíž jméno k té symbolice pasuje.\"</li>\n<li><strong>Personalizace + hodnota (45 s):</strong> „Napadl jste mě, protože XTERRA je nejlepší příklad toho, co se v Prachaticích dá udělat. Logo Vaší firmy na voze ČČK je viditelná demonstrace, že 4 X Production sem patří a záleží jí na místních. A mediálně to má výstup při předání — tisk, rádio, starosta.\"</li>\n<li><strong>Daňový argument (15 s):</strong> „A prakticky — je to daňově uznatelný náklad. Platíte za reklamu, ne za dar.\"</li>\n<li><strong>Close:</strong> „Navrhuju 20 minut osobně, ukážu vizuál a čísla. Hodilo by se Vám příští nebo přespříští týden?\"</li>\n<li><strong>Závěr vždy:</strong> „Ať to vyjde nebo ne — za XTERRA Czech děkuju. Dělá Prachaticím skvělé jméno.\" (buduje vztah a referral)</li>\n</ol>\n", "sources": [["ARES — 4 X Production CZ", "https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/08858055"], ["Michal Piloušek — ziveprachatice.cz", "https://www.ziveprachatice.cz/michal-pilousek"], ["Prachatice.eu — zastupitelstvo 2022–2026", "https://www.prachatice.eu/zastupitelstvo-mesta-2022-2026/os-1293"], ["XTERRA Czech 2025 — ME", "https://www.prachatice.eu/xterra-czech-republic-bude-hostit-mistrovstvi-evropy/d-48261"]]}, {"id": 4, "name": "ARX spol. s r.o.", "ico": "16857631", "address": "Velké náměstí 12, Prachatice I, 383 01", "contact": "Vladimíra Čapková, Lubomír Švec (jednatelé)", "segment": "Maloobchod — parfumerie / knihy", "founded": "1991", "verdict": "OSLOVIT", "vclass": "yes", "score": "8/10", "research": "\n<p><strong>Co firma dělá:</strong> kamenný maloobchod na nejprestižnější adrese okresu — historické Velké náměstí. NACE 47750 (kosmetika / parfumerie), 47610 (knihy), 772 (pronájem). Velmi pravděpodobně <strong>parfumerie + knihkupectví</strong> v přízemí historického domu.</p>\n<p><strong>Tradice:</strong> firma existuje od <strong>28. 5. 1991</strong> — jedna z nejstarších v celém okrese, 34 let na stejném místě. Aktivní ve všech registrech.</p>\n<p><strong>Jednatelé:</strong> Vladimíra Čapková (vazba přímo na náměstí — pravděpodobně stojí za pultem) a Lubomír Švec (Nemocniční, Prachatice). Oba dlouholetí místní.</p>\n<p><strong>Online:</strong> žádný web, žádné sociální sítě, žádné dohledatelné recenze — ryze kamenný, lokální obchod bez digitálního marketingu. Typ majitele-živnostníka staré školy.</p>\n<p><strong>CSR:</strong> žádná dohledatelná stopa — sociální vůz by byl jejich prvním veřejným počinem tohoto druhu (příležitost).</p>\n", "recommendation": "\n<p class=\"verdict-line yes\">Verdikt: OSLOVIT — silný lead</p>\n<ul>\n<li><strong>34 let na náměstí = hrdost a lokální identita.</strong> Emocionální apel funguje maximálně.</li>\n<li><strong>Kamenný obchod závisí na lokální viditelnosti a dobrém jménu</strong> — pod tlakem e-shopů (Notino, Megaknihy) je CSR/viditelnost klíčová. Parfumerie navíc stojí na důvěře a image, kam ČČK ideálně sedí.</li>\n<li><strong>Bez digitální přítomnosti</strong> — sociální vůz je pro ně levná, srozumitelná alternativa fyzické viditelnosti.</li>\n<li><strong>Jednatelka rozhoduje přímo</strong> — žádné korporátní schvalování.</li>\n</ul>\n<p><strong>Pozor:</strong> velmi malá firma, možná omezený rozpočet; ověřit, že obchod stále plně funguje (nenašly se recenze); věk majitelů neznámý.</p>\n", "email": {"subject": "Vaše logo na voze Červeného kříže — 4 roky viditelnosti v Prachaticích", "body": "Vážená paní Čapková,\n\ndovoluji si Vás oslovit jako majitelku ARX — firmy, která patří k historické páteři prachatického náměstí. Od roku 1991 jste součástí Prachatice tak, jak ji znají všichni místní.\n\nReklamní agentura Kompakt připravuje pro Oblastní spolek Českého červeného kříže Prachatice předání nového vozidla. Na voze zbývá jedno místo pro logo regionálního partnera. Firma, která je obsadí, bude po dobu 4 let viditelná na každé cestě vozu ČČK po Prachaticku — s mediální prezentací při slavnostním předání (tisk, rádio) za účasti starosty.\n\nPro firmu jako ARX to znamená trvalou viditelnost i mimo náměstí, spojení Vašeho jména s důvěryhodnou institucí, a daňově uznatelný náklad.\n\nZavolám Vám příští týden a rád zodpovím dotazy — nebo se domluvíme na krátké schůzce přímo u Vás v obchodě.\n\nS pozdravem,\n[jméno] / Reklamní agentura Kompakt / [telefon]"}, "prep": "\n<p><strong>Co vědět:</strong> 34 let na Velkém náměstí je jejich životní dílo a hrdost. Parfumerie/knihy = citlivé na image. Nevěří digitálnímu marketingu, rozumí fyzické přítomnosti. Oslovit nejprve Čapkovou, ideálně osobně v obchodě. Navázat: „Vy jste na náměstí od devadesátého prvního — to málokdo vydrží.\"</p>\n<table class=\"obj\"><tr><th>Námitka</th><th>Odpověď</th></tr>\n<tr><td>„To je moc drahé.\"</td><td>Proto volám přímo Vám — chci ukázat přesné číslo a co za to dostanete. Mohu se zastavit osobně?</td></tr>\n<tr><td>„My reklamu neděláme.\"</td><td>Tohle není reklama — jsou to 4 roky dobrého jména v regionu za cenu jednoho inzerátu.</td></tr>\n<tr><td>„Pošlete to mailem.\"</td><td>Pošlu. Ale raději se zastavím, je to 5 minut — obchody na náměstí rád vídám.</td></tr>\n<tr><td>„Nezajímá nás to.\"</td><td>Mohu se zeptat — znáte ČČK Prachatice? Jde nám o propojení místních firem s touto institucí, ne o prodej reklamy.</td></tr>\n</table>\n", "script": "\n<ol class=\"steps\">\n<li><strong>Otevření:</strong> „Dobrý den, [jméno] z reklamní agentury Kompakt z Prachatic. Mohu mluvit s paní Čapkovou nebo panem Švecem?\"</li>\n<li><strong>Navázání:</strong> „Paní Čapková, dobrý den — vy jste ARX na náměstí? Výborně. Rád Vás oslovuji, protože patříte k mála firmám, co tu jsou opravdu dlouho — od devadesátého prvního. Mám jednu konkrétní věc, bude to krátké.\"</li>\n<li><strong>Hák:</strong> „Připravujeme pro Červený kříž v Prachaticích předání nové dodávky, která pojede po celém okrese. Vůz nese loga firem-partnerů. Hledáme posledního partnera z Prachatic — a napadlo mě, jestli by to pro Vás nedávalo smysl.\"</li>\n<li><strong>Hodnota (3 argumenty):</strong> „Za prvé — parfumerie stojí na důvěře, a Červený kříž k tomu přesně sedí. Za druhé — logo pojede 4 roky po celém Prachaticku bez Vaší starosti. A za třetí — je to daňově uznatelné. Při předání bude starosta a regionální tisk.\"</li>\n<li><strong>Close:</strong> „Mohu se zastavit přímo k Vám do obchodu? Kdy se Vám hodí — dopoledne, nebo odpoledne?\"</li>\n</ol>\n<p class=\"hint\">ČČK Prachatice: Nemocniční 204, web cckpt.cz. Partnerství 4 roky, předání se starostou + regionální tisk a rádio.</p>\n", "sources": [["ARES — ARX spol. s r.o.", "https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/16857631"], ["ČČK Prachatice — O nás", "https://www.cckpt.cz/o-nas/"], ["Lubomír Švec v OR — Kurzy.cz", "https://rejstrik-firem.kurzy.cz/osoby/562944/"]]}, {"id": 5, "name": "ATLANT-SMS CZ s.r.o.", "ico": "25187643", "address": "Jánská 123, Prachatice II, 383 01", "contact": "Erik Nebeský (Prachatice) nebo Tomáš Stehlík (Lhenice) — přes ELEKTRO S.M.S. Prachatice, 388 311 506", "segment": "Maloobchod / velkoobchod elektro", "founded": "1999", "verdict": "OSLOVIT", "vclass": "yes", "score": "7/10", "research": "\n<p><strong>Co firma dělá:</strong> lokální prodejní/distribuční entita skupiny <strong>ELEKTRO S.M.S.</strong> (jeden z největších jihočeských velkoobchodů s elektroinstalačním materiálem a osvětlením). Provozovna v Prachaticích od 13. 1. 1999. Souběžná pobočka ELEKTRO S.M.S. na Kasárenské 483, Prachatice (388 311 506, obchodpt@elektrosms.cz).</p>\n<p><strong>Vlastnická struktura:</strong> 4 jednatelé/společníci — <strong>Tomáš Stehlík</strong> (50, Lhenice) a <strong>Jaromír Stehlík</strong> (74, Lhenice) = otec a syn, rodinná firma; <strong>Erik Nebeský</strong> (53, Dlouhá 84, Prachatice); Petr Hamlík (Strakonice). Všichni napojeni na skupinu ELEKTRO S.M.S. a LEDKO a.s. Základní kapitál 400 000 Kč.</p>\n<p><strong>Finanční zdraví:</strong> zdravá, solventní, bez insolvence. Skupina ELEKTRO S.M.S. má obrat v řádu miliard Kč — investice do reklamy v řádu desítek tisíc je marginální.</p>\n<p><strong>Online:</strong> firma sama bez webu/sociálních sítí; skupina má elektrosms.cz. Členem Jihočeské hospodářské komory.</p>\n<p><strong>CSR:</strong> žádná veřejná stopa specificky pro ATLANT-SMS — příležitost být první.</p>\n", "recommendation": "\n<p class=\"verdict-line yes\">Verdikt: OSLOVIT — střední až vysoká priorita</p>\n<ul>\n<li><strong>Lokální kořeny</strong> (Prachatice od 1999, jednatel Nebeský bydlí přímo ve městě) + <strong>finanční síla</strong> skupiny.</li>\n<li><strong>B2B profil sedí:</strong> zásobují elektromateriálem živnostníky a stavbaře v regionu — ti přesně budou vůz vídat na silnicích.</li>\n<li><strong>Žádná veřejná CSR stopa</strong> — sociální vůz může být jejich první výraznější CSR a PR efekt.</li>\n</ul>\n<p><strong>Pozor:</strong> firma není zvyklá na mediální aktivity (konzervativní); rozhodnutí může jít přes centrálu skupiny v Č. Budějovicích; starší generace (Jaromír, 74) konzervativní. Cílit na <strong>Erika Nebeského</strong> nebo <strong>Tomáše Stehlíka</strong>.</p>\n", "email": {"subject": "Reklamní plocha pro ATLANT-SMS — dodávka pro ČČK Prachatice, 4 roky v regionu", "body": "Vážený pane Nebeský,\n\nobracím se na Vás jako na prachatického jednatele ATLANT-SMS CZ — firmy, která v Prachaticích a okolí působí už čtvrt století.\n\nZastupuji reklamní agenturu Kompakt. Oblastní spolek Českého červeného kříže Prachatice získá novou dodávku a na karoserii bude prostor pro loga firem-partnerů. Vůz bude 4 roky jezdit po celém prachatickém okrese.\n\nCo z toho pro ATLANT-SMS plyne: logo viditelné zákazníkům a živnostníkům v regionu po 4 roky, mediální pokrytí při předání (starosta, tisk, rádio), spojení značky s Červeným křížem a daňově uznatelný náklad.\n\nVaši zákazníci — elektrikáři a stavbaři — projíždějí regionem každý den a dodávka s Vaším logem bude jejich denní součástí.\n\nRád projekt osobně představím, stačí 20 minut. Jsem k dispozici, kdy Vám vyhovuje.\n\nS pozdravem,\n[jméno] / Reklamní agentura Kompakt / [telefon]"}, "prep": "\n<p><strong>Co vědět:</strong> Erik Nebeský (53, Prachatice, Dlouhá 84) — lokální kontakt; Tomáš Stehlík (50, Lhenice) — mladší generace vedení. Firma nemá web, nečekají, že jste je „googlili\". Klientela (živnostníci, stavbaři) vůz uvidí. Členové Jihočeské hospodářské komory. Záložní kanál: ELEKTRO S.M.S. Prachatice, 388 311 506.</p>\n<table class=\"obj\"><tr><th>Námitka</th><th>Odpověď</th></tr>\n<tr><td>„Nemáme rozpočet na reklamu.\"</td><td>Tady nejde o klasickou reklamu — je to daňově uznatelný náklad a zároveň pomoc Červenému kříži.</td></tr>\n<tr><td>„Neznáme výsledky.\"</td><td>Vůz 4 roky jezdí po okrese, vidí ho Vaši zákazníci denně. Slavnostní předání s primátorem navíc přinese mediální zmínku, co se jinak koupit nedá.</td></tr>\n<tr><td>„Musím se poradit / s centrálou.\"</td><td>Připravím jednostránkový podklad, který snadno předáte. Kdy Vám zavolám zpět?</td></tr>\n<tr><td>„Kolik to stojí?\"</td><td>Podle velikosti plochy — konkrétní čísla přinesu osobně. Je to standardní reklamní investice pro firmu Vaší velikosti.</td></tr>\n</table>\n", "script": "\n<ol class=\"steps\">\n<li><strong>Otevření (15 s):</strong> „Dobrý den, [jméno] z reklamní agentury Kompakt. Mohu mluvit s panem Nebeským? … Pane Nebeský, volám kvůli projektu pro Prachatice — reklamní plocha na dodávce pro Červený kříž. Máte chvilku?\"</li>\n<li><strong>Hák (30 s):</strong> „ČČK Prachatice dostane novou dodávku, hledáme dvě tři firmy z regionu, které by na voze měly logo. Vůz pojede 4 roky po celém okrese — a napadlo mě, že ATLANT-SMS, co je v Prachaticích od 1999, by mohla mít zájem.\"</li>\n<li><strong>Hodnota (45 s):</strong> „Logo na autě, které vidí Vaši zákazníci v regionu, předání za účasti starosty s mediálním výstupem, a daňově uznatelný náklad. Pro skupinu jako ELEKTRO S.M.S. je to způsob, jak říct — tady jsme, na region dbáme.\"</li>\n<li><strong>Zjišťovací otázka:</strong> „Děláte v regionu nějaké sponzorské aktivity, nebo by tohle bylo poprvé?\" (pokud ne → „o to víc si to lidi zapamatují\")</li>\n<li><strong>Close:</strong> „Mohl bych přijet na 20 minut a ukázat, jak vůz vypadá a co partnerství zahrnuje? Kdy příští týden?\"</li>\n</ol>\n", "sources": [["Podnikatel.cz — ATLANT-SMS CZ", "https://www.podnikatel.cz/rejstrik/atlant-sms-cz-s-r-o-25187643/"], ["Firmy.cz — ELEKTRO S.M.S. Prachatice", "https://www.firmy.cz/detail/496093-elektro-s-m-s-prachatice-ii.html"], ["Hlídač státu — ATLANT-SMS CZ", "https://www.hlidacstatu.cz/Subjekt/Index/25187643"]]}, {"id": 6, "name": "AUTO - DOSTÁL s.r.o.", "ico": "26099161", "address": "Krumlovská 977, Prachatice II, 383 01", "contact": "Václav Dostál (jednatel) — mobil 737 291 159, auto-dostal@quick.cz", "segment": "Autoservis + autobazar", "founded": "2005", "verdict": "OSLOVIT", "vclass": "yes", "score": "9/10", "research": "\n<p><strong>Co firma dělá:</strong> lokální multioborový <strong>autoservis a autobazar</strong> pro Prachaticko a Písecko. Servis Ford a Fiat, mechanika, diagnostika, karosářství a lakovna, pneuservis, autoskla, autopůjčovna při pojistné události, prodej ojetin. Web <strong>auto-dostal.cz</strong> funkční.</p>\n<p><strong>Reputace:</strong> Firmy.cz / Mapy.cz hodnocení <strong>4,4/5 (7 recenzí)</strong> — samé kladné („příjemné a vstřícné jednání\", „rychlá oprava, ochota v nouzi\"), žádná negativní.</p>\n<p><strong>Stabilita:</strong> 21 let provozu, plátce DPH, <strong>žádný insolvenční záznam</strong>. Provoz Po–Pá 7–17. Rodinná firma.</p>\n<p><strong>Jednatel Václav Dostál</strong> — pravděpodobně zakladatel, jednatel od 2005, uveden jako kontakt na webu. Bez veřejných funkcí. E-mail na lokálním ISP (quick.cz) → starší generace podnikatele.</p>\n<p><strong>CSR:</strong> žádná dohledatelná stopa — sociální vůz by byl první výraznější CSR aktivitou (silný argument). Slabá sociální média = firma hledá viditelnost.</p>\n", "recommendation": "\n<p class=\"verdict-line yes\">Verdikt: OSLOVIT — prioritní lead</p>\n<ul>\n<li><strong>Přirozená synergie:</strong> autoservis + auto na reklamě = vizuálně srozumitelné spojení (a Renault/Dacia od ČČK nekonkuruje jejich Ford/Fiat servisu).</li>\n<li><strong>21 let v Prachaticích, výborné recenze, přímý majitel</strong> = rychlé emoční rozhodnutí bez byrokracie.</li>\n<li><strong>Nulová CSR stopa</strong> → nemůže odmítnout s „to už děláme jinde\"; slabý marketing → firma ocení viditelnost.</li>\n</ul>\n", "email": {"subject": "Vaše logo na voze Červeného kříže — 4 roky viditelnosti v Prachaticích", "body": "Dobrý den, pane Dostále,\n\njmenuji se [jméno] a spolupracuji s reklamní agenturou Kompakt z Prachatic.\n\nPíšu Vám proto, že jsme pro Oblastní spolek Českého červeného kříže Prachatice připravili projekt, který sedí k firmě, jež tu poctivě slouží motoristům přes dvacet let.\n\nČČK Prachatice dostane nové pracovní vozidlo — dodávku. Na voze bude reklamní plocha pro lokální firmu, jejíž logo pojede po celém Prachaticku 4 roky. Předání proběhne za účasti starosty s mediálním pokrytím (tisk, rádio).\n\nProč AUTO DOSTÁL? Firma, která dvacet let opravuje auta Prachatičanů, má přirozené místo na voze, který Prachatičanům pomáhá. Vaši zákazníci to pochopí okamžitě. A je to daňově uznatelný náklad, takže reálný výdaj je po dani výrazně nižší.\n\nRád zavolám nebo se zastavím — vysvětlím to za 10 minut. Hodí se Vám příští týden dopoledne?\n\nS pozdravem,\n[jméno] / [telefon] / Kompakt"}, "prep": "\n<p><strong>Co vědět:</strong> malý rodinný podnik, Dostál rozhoduje sám a hned. Volat na mobil 737 291 159, ideálně út/st kolem 11:30–12:00. Navázat na „dvacet let v Prachaticích\" a výborné recenze. Záloha: auto-dostal@quick.cz.</p>\n<table class=\"obj\"><tr><th>Námitka</th><th>Odpověď</th></tr>\n<tr><td>„To je moc drahé.\"</td><td>Po odpočtu daně je to výrazně méně, a je to na 4 roky — levnější než rok billboardu, který Vám navíc nepřinese PR v tisku.</td></tr>\n<tr><td>„Nemám zájem o reklamu.\"</td><td>Tohle je příběh — firma z Prachatic pomáhá Červenému kříži v Prachaticích. Budou o Vás psát v deníku, to se jinak koupit nedá.</td></tr>\n<tr><td>„To auto nikdo neuvidí.\"</td><td>Vůz ČČK jezdí po celém okrese, tam kde se lidé zastavují a dívají.</td></tr>\n<tr><td>„Musím to probrat s ženou/účetní.\"</td><td>Pošlu jednostránkové shrnutí na mail. Kdy zavolám znovu — příští týden?</td></tr>\n</table>\n", "script": "\n<ol class=\"steps\">\n<li><strong>Otevření (20 s):</strong> „Dobrý den, pane Dostále, [jméno] z agentury Kompakt z Prachatic. Nevolám kvůli reklamě v novinách — volám kvůli projektu přímo pro Prachatice. Máte chvíli?\"</li>\n<li><strong>Hák (30 s):</strong> „Pracujeme s Červeným křížem Prachatice, který dostane novou dodávku. Hledáme jednu lokální firmu, jejíž logo bude na autě 4 roky. Vůz pojede po celém okrese, předání se starostou, psát budou noviny. Napadlo mě, že by to sedělo právě Vám.\"</li>\n<li><strong>Personalizace + hodnota (45 s):</strong> „AUTO DOSTÁL je tu přes dvacet let, lidi Vám důvěřují. Tohle je šance říct nahlas: jsme firma, které na tomhle místě záleží — nejen na autech, ale na lidech. A je to daňově uznatelné, reálná cena po dani je výrazně nižší.\"</li>\n<li><strong>Close:</strong> „Schůzka zabere 15 minut, ukážu, jak auto vypadá a co dostanete. Hodí se Vám středa dopoledne?\"</li>\n</ol>\n", "sources": [["auto-dostal.cz", "https://www.auto-dostal.cz/"], ["Firmy.cz — AUTO DOSTÁL (recenze 4,4/5)", "https://en.firmy.cz/company/727307-auto-dostal-prachatice-ii.html"], ["Živéfirmy.cz — AUTO DOSTÁL", "https://www.zivefirmy.cz/auto-dostal_f441524"]]}, {"id": 7, "name": "Agrocentrum Lainka s.r.o.", "ico": "26084261", "address": "Pod Cvrčkovem 856, Prachatice II (provoz: Vstiš u Dobřan)", "contact": "Vladislav Němeček DiS. (jednatel) — 777 670 070, nemecek@agrocentrum.cz", "segment": "Zemědělská technika + doprava", "founded": "2004", "verdict": "OSLOVIT", "vclass": "maybe", "score": "B+ / 6/10", "research": "\n<p><strong>Co firma dělá:</strong> obchodní a servisní centrum <strong>zemědělské techniky</strong> (agrobazar — traktory, lisy, žací/secí stroje, kombajny atd.), servis, prodej pneumatik a <strong>mezinárodní kamionová doprava</strong> (vlastní obilí do SRN; Mercedes Actros + návěsy Schmitz). Web agrocentrum.cz, e-mail info@agrocentrum.cz.</p>\n<p><strong>Pozor na geografii:</strong> fyzický provoz/showroom je ve <strong>Vstiši u Dobřan</strong> (Plzeňský kraj). Sídlo v Prachaticích (Pod Cvrčkovem) je administrativní/fakturační adresa, kde sídlí jednatel Němeček.</p>\n<p><strong>Síla:</strong> základní kapitál <strong>4,2 mil. Kč</strong>, aktivní provoz (duben 2026 inzerát na řidiče kamionu, mzda 50–55 tis.), bez insolvence/exekucí.</p>\n<p><strong>Lidé:</strong> jednatel Vladislav Němeček DiS. (Prachatice, přímý kontakt 777 670 070). Spoluzakladatel <strong>Bernard Lainka</strong> = významný regionální bio-zemědělec (skupina ekofarem ~3 300 ha, Demeter), hodnotová orientace.</p>\n<p><strong>CSR:</strong> žádná dohledatelná stopa, firma není na sociálních sítích — příležitost být první.</p>\n", "recommendation": "\n<p class=\"verdict-line maybe\">Verdikt: OSLOVIT — střední priorita (B+)</p>\n<ul>\n<li><strong>Pro:</strong> sídlo a jednatel v Prachaticích, finančně silná (kapitál 4,2 mil., nový kamion), aktivní provoz, hodnotová orientace přes Bernarda Lainku (bio, etika), bez dosavadní CSR = prostor být první.</li>\n<li><strong>Proti / riziko:</strong> fyzické centrum je mimo Prachatice (Vstiš) → část vedení nemusí cítit „prachatický\" závazek; firma není na sociálních sítích → nižší zájem o PR.</li>\n</ul>\n<p>Cílit na jednatele Němečka a hrát na to, že firma <strong>sídlí v Prachaticích</strong> a ČČK je prachatická instituce — lokální hrdost a dobré jméno tam, kde podniká.</p>\n", "email": {"subject": "Jméno firmy na autě Červeného kříže v Prachaticích — nabídka na 4 roky", "body": "Dobrý den, pane Němečku,\n\nobracím se na Vás s konkrétní nabídkou — a pokud zaujme, rád ji osobně vysvětlím za 10 minut.\n\nReklamní agentura Kompakt zprostředkovává firmám z Prachaticka možnost umístit logo na „sociální automobil\" — dodávku, která bude trvale předána Oblastnímu spolku Českého červeného kříže Prachatice. Vůz bude jezdit po regionu, stane se součástí předávacího ceremoniálu se starostou a bude medializován (tisk, rádio).\n\nKonkrétně: logo viditelné v Prachaticích a okolí 4 roky, mediální výstup při předání, silné spojení jména Agrocentrum Lainka s Červeným křížem, a daňově uznatelný náklad.\n\nFirmy s kořeny v regionu si tím budují nejen viditelnost, ale i dobré jméno, které zůstane.\n\nMohu zavolat nebo se krátce stavit? Stačí 10 minut.\n\nS pozdravem,\n[jméno] / Kompakt / [telefon]"}, "prep": "\n<p><strong>Co vědět:</strong> jednatel Vladislav Němeček DiS., 777 670 070, nemecek@agrocentrum.cz. Firma finančně solidní. Spolumajitel Bernard Lainka = bio-zemědělec s hodnotovou orientací (příroda, etika, komunita) — silný kulturní kontext. Sezona léto/podzim → rozhodnout teď (jaro). Navázat na sídlo v Prachaticích.</p>\n<table class=\"obj\"><tr><th>Námitka</th><th>Odpověď</th></tr>\n<tr><td>„Nemáme zájem o reklamu.\"</td><td>Tohle není klasická reklama — je to sponzoring humanitární organizace, logo na autě Červeného kříže. Jiná kategorie.</td></tr>\n<tr><td>„Provoz máme ve Vstiši, ne v Prachaticích.\"</td><td>Přesně proto je to zajímavé: sídlo, jméno i Váš kontakt jsou v Prachaticích — tady lidé uvidí Vaše jméno na voze ČČK.</td></tr>\n<tr><td>„Kolik to stojí?\"</td><td>Ceny jsou rozložitelné, jde o 4letý náklad. Než čísla, rád ukážu, co za to firma dostane.</td></tr>\n<tr><td>„Teď není čas (sezóna).\"</td><td>Stačí 10 minut, klidně po telefonu. Kdy by se hodilo příští týden?</td></tr>\n</table>\n", "script": "\n<ol class=\"steps\">\n<li><strong>Otevření (20 s):</strong> „Dobrý den, pane Němečku, [jméno] z reklamní agentury Kompakt z Prachatic. Mám na Vás krátkou otázku — máte minutu?\"</li>\n<li><strong>Hák:</strong> „Znáte Oblastní spolek Červeného kříže tady v Prachaticích? … My pro ně zajišťujeme předání nové dodávky a součástí je možnost pro místní firmy umístit na vůz logo. Proto volám právě Vám.\"</li>\n<li><strong>Hodnota (30 s):</strong> „Vaše logo na voze ČČK 4 roky, vůz jezdí denně po okrese, předání se starostou a regionálními médii, a celé daňově uznatelné. Viditelnost, PR a dobrý pocit — za rozumné peníze rozložené v čase.\"</li>\n<li><strong>Zakotvení:</strong> „Uvažujete o tom, jak firmu zviditelnit lokálně, nebo ukázat, že Vám záleží na Prachaticích?\"</li>\n<li><strong>Close:</strong> „Pošlu podklady na nemecek@agrocentrum.cz a stavím se na 15 minut do Prachatic — kdy příští týden?\"</li>\n</ol>\n", "sources": [["Kurzy.cz — Agrocentrum Lainka", "https://rejstrik-firem.kurzy.cz/26084261/agrocentrum-lainka-sro/"], ["Živéfirmy.cz — Agrocentrum Lainka", "https://www.zivefirmy.cz/agrocentrum-lainka_f1069025"], ["Bio Vstiš — farma B. Lainky", "https://www.biovstis.cz/"]]}, {"id": 8, "name": "B&D Grund, s.r.o.", "ico": "26094801", "address": "Průmyslová 985, Prachatice II, 383 01", "contact": "Johannes Demmelhuber (jednatel, Bavorsko) — bez lokálního kontaktu. Alt.: FURAL Bohemia, 732 578 739, info@fural.cz", "segment": "Nemovitosti — holdingové SPV", "founded": "2005", "verdict": "NEOSLOVIT", "vclass": "no", "score": "2/10 (alt. ZVÁŽIT FURAL)", "research": "\n<p><strong>Co to je:</strong> <strong>majetkové SPV / holding nemovitosti</strong> (NACE 6820 — pronájem vlastních nemovitostí), ne provozní firma. Drží budovu na Průmyslové 985, kde fyzicky vyrábí <strong>FURAL Bohemia s.r.o.</strong> (kovové podhledové systémy). Základní kapitál 4,47 mil. Kč odpovídá financování nákupu nemovitosti.</p>\n<p><strong>Vlastník:</strong> Johannes Demmelhuber, klíčová osoba německé skupiny <strong>Baierl & Demmelhuber</strong> (Töging am Inn / Pleiskirchen, Bavorsko; 900+ zaměstnanců, prémiový interiérový fit-out — Adidas, Lufthansa, BMW). Mateřská firma je uvedena jako akcionář B&D Grund.</p>\n<p><strong>Lokální aktivita B&D Grund:</strong> žádná — bez webu, sociálních sítí, PR či sponzoringu. Skupina v regionu existuje fyzicky přes FURAL Bohemia (česká pobočka, jednatel Christian Demmelhuber), ale majetková entita je oddělená.</p>\n", "recommendation": "\n<p class=\"verdict-line no\">Verdikt: NEOSLOVIT B&D Grund — ZVÁŽIT přesměrování na FURAL Bohemia</p>\n<ul>\n<li><strong>SPV bez provozní identity</strong> — nemá zaměstnance, zákazníky, brand ani co komunikovat veřejnosti.</li>\n<li><strong>Jednatel sídlí v Bavorsku</strong>, ne v Prachaticích — emoční argument „lokální hrdost + ČČK\" nefunguje; pro něj je to jen administrativní nástroj.</li>\n<li><strong>Bez lokálního kontaktu</strong> a rozhodování o CSR je v Německu.</li>\n</ul>\n<p><strong>Alternativa (ZVÁŽIT):</strong> <strong>FURAL Bohemia s.r.o.</strong> (IČO 26036924) — reálný provoz s českými zaměstnanci na téže adrese, jednatel Christian Demmelhuber, kontakt 732 578 739 / info@fural.cz. Stojí za jedno strukturované oslovení, ale rozhodnutí o sponzoringu může stejně být na Německu.</p>\n", "email": {"subject": "Viditelnost FURAL v Prachaticích — projekt s Červeným křížem (alternativa k B&D Grund)", "body": "Pozn.: Pro B&D Grund e-mail nedoporučuji (SPV bez potřeby reklamy, bez lokálního kontaktu). Návrh pro FURAL Bohemia:\n\nDobrý den, pane Demmelhuber,\n\njmenuji se [jméno], zastupuji reklamní agenturu Kompakt z Prachatic.\n\nNaše agentura předává dodávku Oblastnímu spolku Červeného kříže Prachatice — a na voze je reklamní plocha pro lokální firmy, které chtějí být 4 roky viděny v regionu.\n\nFURAL Bohemia je v Prachaticích dlouho a zaměstnává místní lidi. Partnerství s Červeným křížem by mohlo být přirozené — jako viditelnost závodu v regionu i jako daňově uznatelný náklad, a posílí to i zaměstnavatelský brand při náboru.\n\nMohu zaslat krátký přehled, nebo na chvíli zavolat?\n\nS pozdravem,\n[jméno] / [kontakt]"}, "prep": "\n<p><strong>Relevantní jen pro FURAL Bohemia, ne pro B&D Grund.</strong> Volat Christiana Demmelhubera (732 578 739 / info@fural.cz), provoz Po–Pá od 5:30, ideálně 9–11. Mluví zřejmě česky/anglicky/německy. Argumenty: zaměstnává místní → odpovědnost vůči komunitě; viditelnost 4 roky; daňový náklad; posílení zaměstnavatelského brandu. Připravit se na „musím se poradit s vedením v Německu\".</p>\n", "script": "\n<ol class=\"steps\">\n<li><strong>Otevření:</strong> „Dobrý den, pan Demmelhuber? [jméno] z agentury Kompakt z Prachatic. Volám kvůli projektu, který tu připravujeme — dodávka pro Červený kříž Prachatice a reklamní plocha pro místní firmy. Máte chvíli?\"</li>\n<li><strong>Hák:</strong> „FURAL tu funguje dlouho a zaměstnává místní lidi, tak mě napadlo, že projekt s Červeným křížem by mohl dávat smysl — viditelnost v regionu i dobrý důvod pro komunitu.\"</li>\n<li><strong>Kvalifikace:</strong> „Kdo u Vás rozhoduje o sponzoringu — je to rozhodnutí přímo v Prachaticích, nebo přes vedení v Německu?\"</li>\n<li><strong>Close:</strong> „Pošlu Vám stručné podklady, ať máte co předat. Na jakou adresu?\"</li>\n</ol>\n<p class=\"hint\">Do CRM: B&D Grund = NEOSLOVIT (SPV, zahraniční vlastník). FURAL Bohemia = samostatný lead, kategorie ZVÁŽIT.</p>\n", "sources": [["North Data — B&D Grund", "https://www.northdata.com/B&D%20Grund%20s%C2%B7r%C2%B7o%C2%B7,%20Prachatice/ICO%2026094801"], ["Firmy.cz — FURAL Bohemia", "https://en.firmy.cz/company/650633-fural-bohemia-s-r-o-prachatice-ii.html"], ["Baierl & Demmelhuber", "https://www.demmelhuber.de/en"]]}, {"id": 9, "name": "BETO   f.innerHTML=h;
  f.querySelectorAll("[data-pri]").forEach(b=>b.onclick=()=>{filter.pri=b.dataset.pri;render();});
  f.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{filter.status=b.dataset.st;render();});
}
function buildPipe(){
  const counts={}; STATUSES.forEach(s=>counts[s]=0);
  DATA.forEach(c=>counts[effStatus(c)]++);
  const show=[["K oslovení","K osl."],["Zaslán e-mail","E-mail"],["Voláno","Voláno"],["Schůzka","Schůzka"],["Smlouva","Smlouva"],["Neoslovovat","Neosl."]];
  document.getElementById("pipe").innerHTML=show.map(s=>'<div><b style="color:'+SCOLOR[s[0]]+'">'+counts[s[0]]+'</b>'+s[1]+'</div>').join("");
}
function visible(){
  return DATA.filter(c=>{
    if(filter.pri!=="all"&&c.priorita!==filter.pri) return false;
    if(filter.status!=="all"&&effStatus(c)!==filter.status) return false;
    if(filter.q){const s=(c.name+" "+c.segment+" "+c.contact+" "+c.obor).toLowerCase(); if(!s.includes(filter.q.toLowerCase())) return false;}
    return true;
  });
}
function buildNav(){
  const nav=document.getElementById("nav"); const vis=visible(); nav.innerHTML="";
  if(!vis.length){nav.innerHTML='<li style="padding:12px;color:var(--muted);font-size:13px">Nic nenalezeno.</li>';return;}
  vis.forEach(c=>{
    const i=DATA.indexOf(c);
    const li=document.createElement("li");
    const b=document.createElement("button");
    b.className=(i===cur?"active":"");
    b.innerHTML='<span class="navnum">'+c.id+'</span><span class="navtxt"><span class="nm">'+c.name+'</span><span class="sg">'+effStatus(c)+' · '+c.segment+'</span></span><span class="sdot" style="background:'+SCOLOR[effStatus(c)]+'"></span>';
    b.onclick=()=>{cur=i;curtab="research";render();};
    li.appendChild(b);nav.appendChild(li);
  });
}
function crmPanel(c){
  const r=getRec(c.ico); const st=effStatus(c);
  let opts=STATUSES.map(s=>'<option'+(st===s?" selected":"")+'>'+s+'</option>').join("");
  return '<div class="crm"><h3>CRM — stav oslovení <span class="statuspill" id="stpill" style="background:'+SCOLOR[st]+'">'+st+'</span></h3>'+
    '<div class="crm-grid">'+
      '<div><label>Status</label><select id="f-status">'+opts+'</select></div>'+
      '<div><label>E-mail odeslán</label><input type="date" id="f-dateEmail" value="'+(r.dateEmail||"")+'"></div>'+
      '<div><label>Voláno</label><input type="date" id="f-dateCall" value="'+(r.dateCall||"")+'"></div>'+
      '<div><label>Schůzka</label><input type="date" id="f-dateMeeting" value="'+(r.dateMeeting||"")+'"></div>'+
      '<div><label>Smlouva</label><input type="date" id="f-dateContract" value="'+(r.dateContract||"")+'"></div>'+
    '</div>'+
    '<div class="crm-note"><label style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Poznámka</label>'+
      '<textarea id="f-note" placeholder="Domluvy, kontaktní osoba, další krok...">'+(r.note||"")+'</textarea></div>'+
    '<div class="crm-foot"><span id="savedmsg">Změny se ukládají automaticky.</span></div></div>';
}
function bindCrm(c){
  const r=getRec(c.ico);
  function save(stamp){
    r.status=document.getElementById("f-status").value;
    r.dateEmail=document.getElementById("f-dateEmail").value;
    r.dateCall=document.getElementById("f-dateCall").value;
    r.dateMeeting=document.getElementById("f-dateMeeting").value;
    r.dateContract=document.getElementById("f-dateContract").value;
    r.note=document.getElementById("f-note").value;
    saveLocal(); pushRemote(c.ico);
    document.getElementById("stpill").textContent=r.status; document.getElementById("stpill").style.background=SCOLOR[r.status];
    document.getElementById("savedmsg").textContent="Uloženo "+new Date().toLocaleTimeString("cs-CZ").slice(0,5);
    buildNav(); buildPipe();
  }
  const sel=document.getElementById("f-status");
  sel.onchange=()=>{
    const v=sel.value; const map={"Zaslán e-mail":"f-dateEmail","Voláno":"f-dateCall","Schůzka":"f-dateMeeting","Smlouva":"f-dateContract"};
    if(map[v]){const el=document.getElementById(map[v]); if(!el.value) el.value=todayISO();}
    save();
  };
  ["f-dateEmail","f-dateCall","f-dateMeeting","f-dateContract"].forEach(id=>document.getElementById(id).onchange=save);
  document.getElementById("f-note").onblur=save;
}
function render(){
  buildFilters(); buildPipe(); buildNav();
  const c=DATA[cur]; const m=document.getElementById("main");
  let tabsHtml=TABS.map(t=>'<button class="'+(t[0]===curtab?"active":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join("");
  let panes="";
  TABS.forEach(t=>{const key=t[0];let body="";
    if(key==="email"){ body=c.email?('<div class="email-box"><div class="email-head"><span class="email-subj">Předmět: '+c.email.subject+'</span><button class="copybtn" id="cpy">Kopírovat e-mail</button></div><div class="email-body" id="emltxt">'+c.email.body+'</div></div>'):'<div class="noemail">E-mail se nevypracovává — firma je doporučena k NEOSLOVENÍ. Viz Doporučení.</div>'; }
    else if(key==="sources"){ body='<ul class="src">'+c.sources.map(s=>'<li>→ <a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a></li>').join("")+'</ul>'; }
    else body=c[key]||"";
    panes+='<div class="tabpane'+(key===curtab?" active":"")+'">'+body+'</div>';
  });
  const hk=hook();
  m.innerHTML=
    '<div class="syncbar"><span class="dotc" id="syncdot" style="background:'+(hk?'var(--maybe)':'var(--no)')+'"></span><span id="synctxt">'+(hk?'Google Sheet připojen':'Jen lokální uložení (vlož webhook URL)')+'</span>'+
      '<input id="hookurl" placeholder="Google Sheet webhook URL (…/exec)" value="'+hk+'"><button id="savehook">Připojit</button></div>'+
    '<div class="crumb">Lead '+c.id+' / '+DATA.length+' · okres Prachatice</div>'+
    '<div class="title-row"><h2 class="cn">'+c.name+'</h2><span class="badge '+c.vclass+'">'+VLABEL[c.vclass]+' · '+c.score+'</span></div>'+
    '<div class="meta"><div><span class="k">IČO</span>'+c.ico+'</div><div><span class="k">Segment</span>'+c.segment+'</div><div><span class="k">Vznik</span>'+c.founded+'</div><div><span class="k">Adresa</span>'+c.address+'</div><div style="grid-column:1/-1"><span class="k">Kontakt / rozhodovatel</span>'+c.contact+'</div></div>'+
    crmPanel(c)+
    '<div class="tabs">'+tabsHtml+'</div><div class="tabwrap">'+panes+'</div>'+
    '<div class="footer-note">Rešerše z veřejných zdrojů (ARES, OR, firmy.cz, Mapy, weby firem). CRM stav se ukládá lokálně i do Google Sheetu (po připojení webhooku). Údaje ověřte před kontaktem.</div>';
  bindCrm(c);
  m.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{curtab=b.dataset.tab;render();});
  const cpy=document.getElementById("cpy");
  if(cpy)cpy.onclick=()=>{const t=document.getElementById("emltxt").innerText;navigator.clipboard.writeText("Předmět: "+c.email.subject+"\n\n"+t).then(()=>{cpy.textContent="Zkopírováno ✓";setTimeout(()=>cpy.textContent="Kopírovat e-mail",1500);});};
  document.getElementById("savehook").onclick=()=>{setHook(document.getElementById("hookurl").value);pullRemote().then(render);};
}
document.getElementById("q").addEventListener("input",e=>{filter.q=e.target.value;buildNav();});
loadLocal();
render();
pullRemote().then(render);
</script>
</body>
</html>
